name: genomescope2
description: Reference-free profiling of polyploid genomes
usage: genomescope2 [-h] [-v] [-i INPUT] [-o OUTPUT] [-p PLOIDY] [-k KMER_LENGTH] [-n NAME_PREFIX] [-l LAMBDA] [-m MAX_KMERCOV] [--verbose] [--no_unique_sequence] [--json_report] [-t TOPOLOGY] [--initial_repetitiveness INITIAL_REPETITIVENESS] [--initial_heterozygosities INITIAL_HETEROZYGOSITIES] [--transform_exp TRANSFORM_EXP] [--testing] [--true_params TRUE_PARAMS] [--trace_flag] [--num_rounds NUM_ROUNDS] [--fitted_hist] [--start_shift START_SHIFT] [--typical_error TYPICAL_ERROR]
options:
  - names:
      - -h
      - --help
    argument: ""
    description: show this help message and exit
  - names:
      - -v
      - --version
    argument: ""
    description: print the version and exit
  - names:
      - -i
      - --input
    argument: INPUT
    description: input histogram file
  - names:
      - -o
      - --output
    argument: OUTPUT
    description: output directory name
  - names:
      - -p
      - --ploidy
    argument: PLOIDY
    description: ploidy (1, 2, 3, 4, 5, or 6) for model to use [default 2]
  - names:
      - -k
      - --kmer_length
    argument: KMER_LENGTH
    description: kmer length used to calculate kmer spectra [default 21]
  - names:
      - -n
      - --name_prefix
    argument: NAME_PREFIX
    description: optional name_prefix for output files
  - names:
      - -l
      - --lambda
      - --kcov
      - --kmercov
    argument: LAMBDA
    description: optional initial kmercov estimate for model to use
  - names:
      - -m
      - --max_kmercov
    argument: MAX_KMERCOV
    description: optional maximum kmer coverage threshold (kmers with coverage greater than max_kmercov are ignored by the model)
  - names:
      - --verbose
    argument: ""
    description: optional flag to print messages during execution
  - names:
      - --no_unique_sequence
    argument: ""
    description: optional flag to turn off yellow unique sequence line in plots
  - names:
      - --json_report
    argument: ""
    description: write a JSON format report file in addition to the text summary
  - names:
      - -t
      - --topology
    argument: TOPOLOGY
    description: 'ADVANCED: flag for topology for model to use'
  - names:
      - --initial_repetitiveness
    argument: INITIAL_REPETITIVENESS
    description: 'ADVANCED: flag to set initial value for repetitiveness'
  - names:
      - --initial_heterozygosities
    argument: INITIAL_HETEROZYGOSITIES
    description: 'ADVANCED: flag to set initial values for nucleotide heterozygosity rates'
  - names:
      - --transform_exp
    argument: TRANSFORM_EXP
    description: 'ADVANCED: parameter for the exponent when fitting a transformed (x**transform_exp*y vs. x) kmer histogram [default 1]'
  - names:
      - --testing
    argument: ""
    description: 'ADVANCED: flag to create testing.tsv file with model parameters'
  - names:
      - --true_params
    argument: TRUE_PARAMS
    description: 'ADVANCED: flag to state true simulated parameters for testing mode'
  - names:
      - --trace_flag
    argument: ""
    description: 'ADVANCED: flag to turn on printing of iteration progress of nlsLM function'
  - names:
      - --num_rounds
    argument: NUM_ROUNDS
    description: 'ADVANCED: parameter for the number of optimization rounds'
  - names:
      - --fitted_hist
    argument: ""
    description: 'ADVANCED: generates a fitted histogram for kmer multiplicity 0-4 and a lookup table of probabilities'
  - names:
      - --start_shift
    argument: START_SHIFT
    description: 'ADVANCED: coverage shifts to exclude between fitting rounds'
  - names:
      - --typical_error
    argument: TYPICAL_ERROR
    description: 'ADVANCED: typical level of sequencing error'
version: GenomeScope 2.0
