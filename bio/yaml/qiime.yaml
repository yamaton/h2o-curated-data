      - name: classify-consensus-vsearch
        description: VSEARCH-based consensus taxonomy classifier
        usage: "qiime feature-classifier classify-consensus-vsearch \n    [OPTIONS]"
        options:
          - names:
              - --i-query
            argument: ARTIFACT
            description: Query Sequences. [required]
          - names:
              - --i-reference-reads
            argument: ARTIFACT
            description: Reference sequences. [required]
          - names:
              - --i-reference-taxonomy
            argument: ARTIFACT
            description: Reference taxonomy labels. [required]
          - names:
              - --p-maxaccepts
            argument: VALUE
            description: 'Maximum number of hits to keep for each query. Set to "all" to keep all hits > perc-identity similarity. Note that if strand=both, maxaccepts will keep N hits for each direction (if searches in the opposite direction yield results that exceed the minimum perc-identity). In those cases use maxhits to control the total number of hits returned. This option works in pair with maxrejects. The search process sorts target sequences by decreasing number of k-mers they have in common with the query sequence, using that information as a proxy for sequence similarity. After pairwise alignments, if the first target sequence passes the acceptation criteria, it is accepted as best hit and the search process stops for that query. If maxaccepts is set to a higher value, more hits are accepted. If maxaccepts and maxrejects are both set to "all", the complete database is searched. [default: 10]'
          - names:
              - --p-perc-identity
            argument: PROPORTION
            description: 'Reject match if percent identity to query is lower. [default: 0.8]'
          - names:
              - --p-query-cov
            argument: PROPORTION
            description: 'Reject match if query alignment coverage per high-scoring pair is lower. [default: 0.8]'
          - names:
              - --p-strand
            argument: TEXT
            description: 'Align against reference sequences in forward ("plus") or both directions ("both"). [default: ''both'']'
          - names:
              - --p-search-exact
              - --p-no-search-exact
            argument: ""
            description: 'Search for exact full-length matches to the query sequences. Only 100% exact matches are reported and this command is much faster than the default. If True, the perc-identity, query-cov, maxaccepts, and maxrejects settings are ignored. Note: query and reference reads must be trimmed to the exact same DNA locus (e.g., primer site) because only exact matches will be reported. [default: False]'
          - names:
              - --p-top-hits-only
              - --p-no-top-hits-only
            argument: ""
            description: 'Only the top hits between the query and reference sequence sets are reported. For each query, the top hit is the one presenting the highest percentage of identity. Multiple equally scored top hits will be used for consensus taxonomic assignment if maxaccepts is greater than 1. [default: False]'
          - names:
              - --p-maxhits
            argument: VALUE
            description: 'Maximum number of hits to show once the search is terminated. [default: ''all'']'
          - names:
              - --p-maxrejects
            argument: VALUE
            description: 'Maximum number of non-matching target sequences to consider before stopping the search. This option works in pair with maxaccepts (see maxaccepts description for details). [default: ''all'']'
          - names:
              - --p-output-no-hits
              - --p-no-output-no-hits
            argument: ""
            description: 'Report both matching and non-matching queries. WARNING: always use the default setting for this option unless if you know what you are doing! If you set this option to False, your sequences and feature table will need to be filtered to exclude unclassified sequences, otherwise you may run into errors downstream from missing feature IDs. [default: True]'
          - names:
              - --p-weak-id
            argument: PROPORTION
            description: 'Show hits with percentage of identity of at least N, without terminating the search. A normal search stops as soon as enough hits are found (as defined by maxaccepts, maxrejects, and perc-identity). As weak-id reports weak hits that are not deduced from maxaccepts, high perc-identity values can be used, hence preserving both speed and sensitivity. Logically, weak-id must be smaller than the value indicated by perc-identity, otherwise this option will be ignored. [default: 0.0]'
