              - --i-alignment
            argument: ARTIFACT
            description: The alignment to be masked. [required]
          - names:
              - --p-max-gap-frequency
            argument: PROPORTION
            description: 'The maximum relative frequency of gap characters in a column for the column to be retained. This relative frequency must be a number between 0.0 and 1.0 (inclusive), where 0.0 retains only those columns without gap characters, and 1.0 retains all columns regardless of gap character frequency. [default: 1.0]'
          - names:
              - --p-min-conservation
            argument: PROPORTION
            description: 'The minimum relative frequency of at least one non-gap character in a column for that column to be retained. This relative frequency must be a number between 0.0 and 1.0 (inclusive). For example, if a value of 0.4 is provided, a column will only be retained if it contains at least one character that is present in at least 40% of the sequences. [default: 0.4]'
