              - --p-strategy
            argument: TEXT
            description: 'Specifies the multiple alignment strategy to use. Exactly one strategy may be specified. Valid options are: ''auto'', ''nofft'', ''globalpair'', ''localpair'', and ''genafpair''. Default strategy: FFT-NS. [optional]'
          - names:
              - --p-maxiterate
            argument: INTEGER
            description: Specifies how many iterative refinement cycles are performed after the initial progressive alignment. By default, no iterative refinement is performed. [optional]
          - names:
              - --p-retree
            argument: INTEGER
            description: Specifies the number of times the guide tree is rebuilt during the progressive stage. Typically, tree topology stabilizes after 2-3 iterations and higher values rarely improves alignment quality enough to justify the extra computation. [optional]
