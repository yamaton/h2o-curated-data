            argument: TEXT
            description: Data field of the data type "genome_feature". This parameter can only be used in conjunction with the "ids" parameter. Retrieves all data associated with the IDs/values specified in parameter "ids" in this data field. Check https://www.bv-brc.org/api/doc/genome_feature for allowed data fields. [optional]
          - names:
              - --p-ids
            argument: TEXT...
            description: IDs/values of the corresponding data field. This parameter can only be used in conjunction with the "data-field" parameter. Retrieves all data associated with these IDs/values in the specified data field. [optional]
          - names:
              - --p-ranks
