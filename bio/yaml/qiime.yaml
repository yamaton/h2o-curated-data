              - --p-rank-propagation
              - --p-no-rank-propagation
            argument: ""
            description: 'If a rank has no taxonomy associated with it, the taxonomy from the upper-level rank of that lineage, will be propagated downward. For example, if we are missing the genus label for ''f__Pasteurellaceae; g__''then the ''f__'' rank will be propagated to become: ''f__Pasteurellaceae; g__Pasteurellaceae''. [default: True]'
          - names:
              - --o-genes
            argument: ARTIFACT
            description: Gene [required]
          - names:
              - --o-proteins
            argument: ARTIFACT
            description: proteins [required]
          - names:
              - --o-taxonomy
            argument: ARTIFACT
            description: Taxonomy data for all sequences. [required]
          - names:
              - --o-loci
            argument: ARTIFACT
            description: loci [required]
          - names:
              - --output-dir
            argument: PATH
            description: Output unspecified results to a directory
          - names:
              - --verbose
              - --quiet
            argument: ""
            description: Display verbose output to stdout and/or stderr during execution of this action. Or silence output if execution is successful (silence is golden).
