      - name: blast
        description: BLAST+ local alignment search.
        usage: qiime feature-classifier blast [OPTIONS]
        options:
          - names:
              - --i-query
            argument: ARTIFACT
            description: Query sequences. [required]
          - names:
              - --i-reference-reads
            argument: ARTIFACT
            description: Reference sequences. Incompatible with blastdb. [optional]
          - names:
              - --i-blastdb
            argument: ARTIFACT
            description: BLAST indexed database. Incompatible with reference-reads. [optional]
          - names:
              - --p-maxaccepts
            argument: INTEGER
            description: 'Maximum number of hits to keep for each query. BLAST will choose the first N hits in the reference database that exceed perc-identity similarity to query. NOTE: the database is not sorted by similarity to query, so these are the first N hits that pass the threshold, not necessarily the top N hits. [default: 10]'
          - names:
              - --p-perc-identity
            argument: PROPORTION
            description: 'Reject match if percent identity to query is lower. [default: 0.8]'
          - names:
              - --p-query-cov
            argument: PROPORTION
            description: 'Reject match if query alignment coverage per high-scoring pair is lower. Note: this uses blastn''s qcov_hsp_perc parameter, and may not behave identically to the query-cov parameter used by classify-consensus-vsearch. [default: 0.8]'
          - names:
              - --p-strand
            argument: TEXT
            description: 'Align against reference sequences in forward ("plus"), reverse ("minus"), or both directions ("both"). [default: ''both'']'
          - names:
              - --p-evalue
            argument: NUMBER
            description: 'BLAST expectation value (E) threshold for saving hits. [default: 0.001]'
          - names:
              - --p-output-no-hits
              - --p-no-output-no-hits
            argument: ""
            description: 'Report both matching and non-matching queries. WARNING: always use the default setting for this option unless if you know what you are doing! If you set this option to False, your sequences and feature table will need to be filtered to exclude unclassified sequences, otherwise you may run into errors downstream from missing feature IDs. Set to FALSE to mirror default BLAST search. [default: True]'
          - names:
              - --p-num-threads
            argument: NTHREADS
            description: 'Number of threads (CPUs) to use in the BLAST search. Pass 0 to use all available CPUs. [default: 1]'
          - names:
              - --o-search-results
            argument: ARTIFACT
            description: Top hits for each query. [required]
          - names:
              - --output-dir
            argument: PATH
            description: Output unspecified results to a directory
          - names:
