            argument: NTHREADS
            description: 'The number of threads. (Use `auto` to automatically use all available cores) [default: 1]'
          - names:
              - --p-parttree
              - --p-no-parttree
            argument: ""
            description: 'This flag is required if the number of sequences being aligned are larger than 1,000,000. Disabled by default. [default: False]'
          - names:
              - --p-addfragments
              - --p-no-addfragments
            argument: ""
            description: 'Optimize for the addition of short sequence fragments (for example, primer or amplicon sequences). If not set, default sequence addition is used. [default: False]'
          - names:
              - --p-keeplength
              - --p-no-keeplength
            argument: ""
            description: 'If selected, the alignment length will be unchanged. Any added sequence that would otherwise introduce new insertions into the alignment, will have those insertions deleted, to preserve original alignment length. [default: False]'
          - names:
              - --p-large
              - --p-no-large
            argument: ""
            description: 'This flag is required when aligning very large datasets that do not otherwise fit into memory. Temporary data is then stored in files, instead of RAM. The --use-cache flag specifies the storage location of the temporary files created. By default, $TMP/qiime2/ is used. [default: False]'
