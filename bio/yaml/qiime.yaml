          - names:
              - --p-trim-overhang
              - --p-no-trim-overhang
            argument: ""
            description: 'If TRUE, "overhangs" in the alignment after merging are trimmed off. "Overhangs" are when the reverse read extends past the start of the forward read, and vice-versa, as can happen when reads are longer than the amplicon and read into the other-direction primer region. [default: False]'
          - names:
