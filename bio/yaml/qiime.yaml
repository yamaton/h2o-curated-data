            argument: DIRECTORY
            description: 'Specify the cache to be used for the intermediate work of this action. If not provided, the default cache under $TMP/qiime2/<uname> will be used. IMPORTANT FOR HPC USERS: If you are on an HPC system and are using parallel execution it is important to set this to a location that is globally accessible to all nodes in the cluster.'
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: trim-paired
        description: Find and remove adapters in demultiplexed paired-end sequences.
        usage: qiime cutadapt trim-paired [OPTIONS]
        options:
          - names:
              - --i-demultiplexed-sequences
            argument: ARTIFACT
            description: The paired-end sequences to be trimmed. [required]
          - names:
              - --p-adapter-f
            argument: TEXT...
            description: Sequence of an adapter ligated to the 3' end. The adapter and any subsequent bases are trimmed. If a `$` is appended, the adapter is only found if it is at the end of the read. Search in forward read. If your sequence of interest is "framed" by a 5' and a 3' adapter, use this parameter to define a "linked" primer - see https://cutadapt.readthedocs.io for complete details. [optional]
          - names:
              - --p-front-f
            argument: TEXT...
            description: Sequence of an adapter ligated to the 5' end. The adapter and any preceding bases are trimmed. Partial matches at the 5' end are allowed. If a `^` character is prepended, the adapter is only found if it is at the beginning of the read. Search in forward read. [optional]
          - names:
              - --p-anywhere-f
            argument: TEXT...
            description: Sequence of an adapter that may be ligated to the 5' or 3' end. Both types of matches as described under `adapter` and `front` are allowed. If the first base of the read is part of the match, the behavior is as with `front`, otherwise as with `adapter`. This option is mostly for rescuing failed library preparations - do not use if you know which end your adapter was ligated to. Search in forward read. [optional]
          - names:
              - --p-adapter-r
            argument: TEXT...
            description: Sequence of an adapter ligated to the 3' end. The adapter and any subsequent bases are trimmed. If a `$` is appended, the adapter is only found if it is at the end of the read. Search in reverse read. If your sequence of interest is "framed" by a 5' and a 3' adapter, use this parameter to define a "linked" primer - see https://cutadapt.readthedocs.io for complete details. [optional]
          - names:
              - --p-front-r
            argument: TEXT...
            description: Sequence of an adapter ligated to the 5' end. The adapter and any preceding bases are trimmed. Partial matches at the 5' end are allowed. If a `^` character is prepended, the adapter is only found if it is at the beginning of the read. Search in reverse read. [optional]
          - names:
              - --p-anywhere-r
            argument: TEXT...
            description: Sequence of an adapter that may be ligated to the 5' or 3' end. Both types of matches as described under `adapter` and `front` are allowed. If the first base of the read is part of the match, the behavior is as with `front`, otherwise as with `adapter`. This option is mostly for rescuing failed library preparations - do not use if you know which end your adapter was ligated to. Search in reverse read. [optional]
          - names:
              - --p-forward-cut
            argument: INTEGER
            description: 'Unconditionally remove bases from the beginning or end of each forward read. Cutting is applied before adapter trimming. Use a positive integer to remove bases from the 5'' end and a negative integer to remove bases from the 3'' end. [default: 0]'
          - names:
              - --p-reverse-cut
            argument: INTEGER
            description: 'Unconditionally remove bases from the beginning or end of each reverse read. Cutting is applied before adapter trimming. Use a positive integer to remove bases from the 5'' end and a negative integer to remove bases from the 3'' end. [default: 0]'
          - names:
              - --p-error-rate
            argument: PROPORTION
            description: 'Maximum allowed error rate. [default: 0.1]'
          - names:
              - --p-indels
              - --p-no-indels
            argument: ""
            description: 'Allow insertions or deletions of bases when matching adapters. [default: True]'
          - names:
              - --p-times
            argument: INTEGER
            description: 'Remove multiple occurrences of an adapter if it is repeated, up to `times` times. [default: 1]'
          - names:
              - --p-overlap
            argument: INTEGER
            description: 'Require at least `overlap` bases of overlap between read and adapter for an adapter to be found. [default: 3]'
          - names:
              - --p-match-read-wildcards
              - --p-no-match-read-wildcards
            argument: ""
            description: 'Interpret IUPAC wildcards (e.g., N) in reads. [default: False]'
          - names:
              - --p-match-adapter-wildcards
              - --p-no-match-adapter-wildcards
            argument: ""
            description: 'Interpret IUPAC wildcards (e.g., N) in adapters. [default: True]'
          - names:
              - --p-minimum-length
            argument: INTEGER
            description: 'Discard reads shorter than specified value. Note, the cutadapt default of 0 has been overridden, because that value produces empty sequence records. [default: 1]'
          - names:
              - --p-discard-untrimmed
              - --p-no-discard-untrimmed
            argument: ""
            description: 'Discard reads in which no adapter was found. [default: False]'
          - names:
              - --p-max-expected-errors
            argument: NUMBER
            description: Discard reads that exceed maximum expected erroneous nucleotides. [optional]
          - names:
              - --p-max-n
            argument: NUMBER
            description: Discard reads with more than COUNT N bases. If COUNT_or_FRACTION is a number between 0 and 1, it is interpreted as a fraction of the read length. [optional]
          - names:
              - --p-quality-cutoff-5end
            argument: INTEGER
            description: 'Trim nucleotides with Phred score quality lower than threshold from 5 prime end. [default: 0]'
          - names:
              - --p-quality-cutoff-3end
            argument: INTEGER
            description: 'Trim nucleotides with Phred score quality lower than threshold from 3 prime end. [default: 0]'
          - names:
