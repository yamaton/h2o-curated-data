              - --p-rql-query
            argument: TEXT
            description: 'Query in RQL format. To download all data for genome_ids "224308.43" and "2030927.4755", the RQL query looks like this: "in(genome_id,(224308.43,2030927.4755))". While "in" is an RQL operator, "genome_id" is a data field and "224308.43,2030927.4755" are the values. It is important to percent encode values if they contain illegal characters like spaces. The values "Bacillus subtilis" and "Bacteroidales bacterium" have to be provided with percent encoded quotes (%22) and spaces (%20) like this: "in(species,(%22Bacillus%20subtilis%22,%22Bacteroidal es%20bacterium%22))". Check https://www.bv-brc.org/api/doc/ for documentation on data types and corresponding data fields. [optional]'
