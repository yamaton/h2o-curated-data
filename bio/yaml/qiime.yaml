      - name: merge-taxa
        description: Compare taxonomies and select the longest, highest scoring, or find the least common ancestor.
        usage: qiime rescript merge-taxa [OPTIONS]
        options:
          - names:
              - --i-data
            argument: ARTIFACTS...
            description: Two or more feature taxonomies to be merged. [required]
          - names:
              - --p-mode
            argument: TEXT
            description: 'How to merge feature taxonomies: "len" will select the taxonomy with the most elements (e.g., species level will beat genus level); "lca" will find the least common ancestor and report this consensus taxonomy; "score" will select the taxonomy with the highest score (e.g., confidence or consensus score). Note that "score" assumes that this score is always contained as the second column in a feature taxonomy dataframe. "majority" finds the LCA consensus while giving preference to majority labels. "super" finds the LCA consensus while giving preference to majority labels and collapsing substrings into superstrings. For example, when a more specific taxonomy does not contradict a less specific taxonomy, the more specific is chosen. That is, "g__Faecalibacterium; s__prausnitzii", will be preferred over [default: ''len'']'
          - names:
              - --p-rank-handle-regex
            argument: TEXT
            description: 'Regular expression indicating which taxonomic rank a label belongs to; this handle is stripped from the label prior to operating on the taxonomy. The net effect is that ambiguous or empty levels can be removed prior to comparison, enabling selection of taxonomies with more complete taxonomic information. For example, "^[dkpcofgs]__" will recognize greengenes or silva rank handles. Note that rank_handles are removed but not replaced; use the new_rank_handle parameter to replace the rank handles. [default: ''^[dkpcofgs]__'']'
          - names:
              - --p-new-rank-handles
            argument: VALUES... List
            description: '| List[Str   % Choices(''domain'', ''superkingdom'', ''kingdom'', ''subkingdom'', ''superphylum'', ''phylum'', ''subphylum'', ''infraphylum'', ''superclass'', ''class'', ''subclass'', ''infraclass'', ''cohort'', ''superorder'', ''order'', ''suborder'', ''infraorder'', ''parvorder'', ''superfamily'', ''family'', ''subfamily'', ''tribe'', ''subtribe'', ''genus'', ''subgenus'', ''species group'', ''species subgroup'', ''species'', ''subspecies'', ''forma'')]'
          - names:
              - --p-unclassified-label
            argument: TEXT
            description: 'Specifies what label should be used for taxonomies that could not be resolved (when LCA modes are used). [default: ''Unassigned'']'
          - names:
              - --o-merged-data
            argument: ARTIFACT FeatureData
            description: '[required]'
          - names:
              - --o-merged-data
            argument: ARTIFACT FeatureDataTaxonomy
            description: '[required]'
