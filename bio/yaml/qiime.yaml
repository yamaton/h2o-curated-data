      - name: beta-phylogenetic-meta-passthrough
        description: Beta Phylogenetic Meta Passthrough
        usage: "qiime diversity-lib beta-phylogenetic-meta-passthrough \n    [OPTIONS]"
        options:
          - names:
              - --i-tables
            argument: ARTIFACTS...
            description: The feature tables containing the samples over which beta diversity should be computed. [required]
          - names:
              - --i-phylogenies
            argument: ARTIFACTS...
            description: Phylogenetic trees containing tip identifiers that correspond to the feature identifiers in the table. This tree can contain tip ids that are not present in the table, but all feature ids in the table must be present in this tree. [required]
          - names:
              - --p-metric
            argument: TEXT
            description: The beta diversity metric to be computed. [required]
          - names:
              - --p-threads
            argument: NTHREADS
            description: 'The number of CPU threads to use in performing this calculation. May not exceed the number of available physical cores. If threads = ''auto'', one thread will be created for each identified CPU core on the host. [default: 1]'
          - names:
              - --p-variance-adjusted
              - --p-no-variance-adjusted
            argument: ""
            description: 'Perform variance adjustment based on Chang et al. BMC Bioinformatics 2011. Weights distances based on the proportion of the relative abundance represented between the samples at a given node under evaluation. [default: False]'
          - names:
              - --p-alpha
            argument: PROPORTION
            description: This parameter is only used when the choice of metric is generalized_unifrac. The value of alpha controls importance of sample proportions. 1.0 is weighted normalized UniFrac. 0.0 is close to unweighted UniFrac, but only if the sample proportions are dichotomized. [optional]
          - names:
              - --p-bypass-tips
              - --p-no-bypass-tips
            argument: ""
            description: 'In a bifurcating tree, the tips make up about 50% of the nodes in a tree. By ignoring them, specificity can be traded for reduced compute time. This has the effect of collapsing the phylogeny, and is analogous (in concept) to moving from 99% to 97% [default: False]'
          - names:
              - --p-weights
            argument: NUMBERS...
            description: The weight applied to each tree/table pair. This tuple is expected to be in index order with tables and phylogenies. Default is to weight each tree/table pair evenly. [optional]
          - names:
              - --p-consolidation
            argument: TEXT
            description: 'The matrix consolidation method, which determines how the individual distance matrices are aggregated [default: ''skipping_missing_values'']'
          - names:
              - --o-distance-matrix
            argument: ARTIFACT
            description: The resulting distance matrix. [required]
          - names:
              - --output-dir
