          - names:
              - --p-trunc-len-r
            argument: INTEGER
            description: Position at which reverse read sequences should be truncated due to decrease in quality. This truncates the 3' end of the of the input sequences, which will be the bases that were sequenced in the last cycles. Reads that are shorter than this value will be discarded. After this parameter is applied there must still be at least a 12 nucleotide overlap between the forward and reverse reads. If 0 is provided, no truncation or length filtering will be performed [required]
          - names:
              - --p-trim-left-f
            argument: INTEGER
            description: 'Position at which forward read sequences should be trimmed due to low quality. This trims the 5'' end of the input sequences, which will be the bases that were sequenced in the first cycles. [default: 0]'
          - names:
              - --p-trim-left-r
            argument: INTEGER
            description: 'Position at which reverse read sequences should be trimmed due to low quality. This trims the 5'' end of the input sequences, which will be the bases that were sequenced in the first cycles. [default: 0]'
          - names:
              - --p-max-ee-f
