          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: ancom
        description: Apply ANCOM to identify features that differ in abundance.
        usage: qiime composition ancom [OPTIONS]
        options:
          - names:
              - --i-table
            argument: ARTIFACT
            description: The feature table to be used for ANCOM computation. [required]
          - names:
              - --m-metadata-file
              - --m-metadata-column
            argument: METADATA
            description: The categorical sample metadata column to test for differential abundance across. [required]
          - names:
              - --p-transform-function
            argument: TEXT
            description: 'The method applied to transform feature values before generating volcano plots. [default: ''clr'']'
          - names:
              - --p-difference-function
            argument: TEXT
            description: The method applied to visualize fold difference in feature abundances across groups for volcano plots. [optional]
          - names:
              - --p-filter-missing
              - --p-no-filter-missing
            argument: ""
            description: 'If True, samples with missing metadata values will be filtered from the table prior to analysis. If False, an error will be raised if there are any missing metadata values. [default: False]'
          - names:
              - --o-visualization
            argument: VISUALIZATION
            description: '[required]'
          - names:
              - --output-dir
            argument: PATH
            description: Output unspecified results to a directory
          - names:
              - --verbose
              - --quiet
            argument: ""
            description: Display verbose output to stdout and/or stderr during execution of this action. Or silence output if execution is successful (silence is golden).
          - names:
