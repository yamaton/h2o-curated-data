  - name: dada2
    description: Plugin for sequence quality control with DADA2.
    usage: qiime dada2 [OPTIONS] COMMAND [ARGS]...
    options:
      - names:
          - --version
        argument: ""
        description: Show the version and exit.
      - names:
          - --example-data
        argument: PATH
        description: Write example data and exit.
      - names:
          - --citations
        argument: ""
        description: Show citations and exit.
      - names:
          - --help
        argument: ""
        description: Show this message and exit.
    subcommands:
      - name: denoise-ccs
        description: Denoise and dereplicate single-end Pacbio CCS
        usage: qiime dada2 denoise-ccs [OPTIONS]
        options:
          - names:
              - --i-demultiplexed-seqs
            argument: ARTIFACT
            description: The single-end demultiplexed PacBio CCS sequences to be denoised. [required]
          - names:
              - --p-front
            argument: TEXT
            description: Sequence of an adapter ligated to the 5' end. The adapter and any preceding bases are trimmed. Can contain IUPAC ambiguous nucleotide codes. Note, primer direction is 5' to 3'. Primers are removed before trim and filter step. Reads that do not contain the primer are discarded. Each read is re-oriented if the reverse complement of the read is a better match to the provided primer sequence. This is recommended for PacBio CCS reads, which come in a random mix of forward and reverse-complement orientations. [required]
          - names:
              - --p-adapter
            argument: TEXT
            description: Sequence of an adapter ligated to the 3' end. The adapter and any preceding bases are trimmed. Can contain IUPAC ambiguous nucleotide codes. Note, primer direction is 5' to 3'. Primers are removed before trim and filter step. Reads that do not contain the primer are discarded. [optional]
          - names:
              - --p-max-mismatch
            argument: INTEGER
            description: 'The number of mismatches to tolerate when matching reads to primer sequences - see http://benjjneb.github.io/dada2/ for complete details. [default: 2]'
          - names:
              - --p-indels
              - --p-no-indels
            argument: ""
            description: 'Allow insertions or deletions of bases when matching adapters. Note that primer matching can be significantly slower, currently about 4x slower [default: False]'
          - names:
              - --p-trunc-len
            argument: INTEGER
            description: 'Position at which sequences should be truncated due to decrease in quality. This truncates the 3'' end of the of the input sequences, which will be the bases that were sequenced in the last cycles. Reads that are shorter than this value will be discarded. If 0 is provided, no truncation or length filtering will be performed. Note: Since Pacbio CCS sequences were normally with very high quality scores, there is no need to truncate the Pacbio CCS sequences. [default: 0]'
          - names:
              - --p-trim-left
            argument: INTEGER
            description: 'Position at which sequences should be trimmed due to low quality. This trims the 5'' end of the of the input sequences, which will be the bases that were sequenced in the first cycles. [default: 0]'
          - names:
              - --p-max-ee
            argument: NUMBER
            description: 'Reads with number of expected errors higher than this value will be discarded. [default: 2.0]'
          - names:
              - --p-trunc-q
            argument: INTEGER
            description: 'Reads are truncated at the first instance of a quality score less than or equal to this value. If the resulting read is then shorter than `trunc-len`, it is discarded. [default: 2]'
          - names:
              - --p-min-len
            argument: INTEGER
            description: 'Remove reads with length less than minLen. minLen is enforced after trimming and truncation. For 16S Pacbio CCS, suggest 1000. [default: 20]'
          - names:
              - --p-max-len
            argument: INTEGER
            description: 'Remove reads prior to trimming or truncation which are longer than this value. If 0 is provided no reads will be removed based on length. For 16S Pacbio CCS, suggest 1600. [default: 0]'
          - names:
              - --p-pooling-method
            argument: TEXT
            description: 'The method used to pool samples for denoising. "independent": Samples are denoised indpendently. "pseudo": The pseudo-pooling method is used to approximate pooling of samples. In short, samples are denoised independently once, ASVs detected in at least 2 samples are recorded, and samples are denoised independently a second time, but this time with prior knowledge of the recorded ASVs and thus higher sensitivity to those ASVs. [default: ''independent'']'
          - names:
              - --p-chimera-method
            argument: TEXT
            description: 'The method used to remove chimeras. "none": No chimera removal is performed. "consensus": Chimeras are detected in samples individually, and sequences found chimeric in a sufficient fraction of samples are removed. [default: ''consensus'']'
          - names:
              - --p-min-fold-parent-over-abundance
            argument: NUMBER
            description: 'The minimum abundance of potential parents of a sequence being tested as chimeric, expressed as a fold-change versus the abundance of the sequence being tested. Values should be greater than or equal to 1 (i.e. parents should be more abundant than the sequence being tested). Suggest 3.5. This parameter has no effect if chimera-method is "none". [default: 3.5]'
          - names:
              - --p-allow-one-off
              - --p-no-allow-one-off
            argument: ""
            description: 'Bimeras that are one-off from exact are also identified if the `allow-one-off` argument is True. If True, a sequence will be identified as bimera if it is one mismatch or indel away from an exact bimera. [default: False]'
          - names:
              - --p-n-threads
            argument: NTHREADS
            description: 'The number of threads to use for multithreaded processing. If 0 is provided, all available cores will be used. [default: 1]'
          - names:
              - --p-n-reads-learn
            argument: INTEGER
            description: 'The number of reads to use when training the error model. Smaller numbers will result in a shorter run time but a less reliable error model. [default: 1000000]'
          - names:
              - --p-hashed-feature-ids
              - --p-no-hashed-feature-ids
            argument: ""
            description: 'If true, the feature ids in the resulting table will be presented as hashes of the sequences defining each feature. The hash will always be the same for the same sequence so this allows feature tables to be merged across runs of this method. You should only merge tables if the exact same parameters are used for each run. [default: True]'
          - names:
              - --p-retain-all-samples
              - --p-no-retain-all-samples
            argument: ""
            description: 'If True all samples input to dada2 will be retained in the output of dada2, if false samples with zero total frequency are removed from the table. [default: True]'
          - names:
              - --o-table
            argument: ARTIFACT
            description: The resulting feature table. [required]
          - names:
              - --o-representative-sequences
            argument: ARTIFACT
            description: The resulting feature sequences. Each feature in the feature table will be represented by exactly one sequence. [required]
          - names:
              - --o-denoising-stats
            argument: ARTIFACT
            description: A table listing per-sample read retention counts and percentages after each stage of the pipeline. [required]
          - names:
              - --o-base-transition-stats
            argument: ARTIFACT DADA2BaseTransitionStats
            description: A table listing the transition rates of each ordered pair of nucleotides at each quality score. [required]
          - names:
              - --output-dir
            argument: PATH
            description: Output unspecified results to a directory
          - names:
              - --verbose
              - --quiet
            argument: ""
            description: Display verbose output to stdout and/or stderr during execution of this action. Or silence output if execution is successful (silence is golden).
          - names:
              - --example-data
            argument: PATH
            description: Write example data and exit.
          - names:
              - --citations
            argument: ""
            description: Show citations and exit.
          - names:
              - --use-cache
            argument: DIRECTORY
            description: 'Specify the cache to be used for the intermediate work of this action. If not provided, the default cache under $TMP/qiime2/<uname> will be used. IMPORTANT FOR HPC USERS: If you are on an HPC system and are using parallel execution it is important to set this to a location that is globally accessible to all nodes in the cluster.'
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: denoise-paired
        description: Denoise and dereplicate paired-end sequences
        usage: qiime dada2 denoise-paired [OPTIONS]
        options:
          - names:
              - --i-demultiplexed-seqs
            argument: ARTIFACT
            description: The paired-end demultiplexed sequences to be denoised. [required]
          - names:
