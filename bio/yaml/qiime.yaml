  - name: cutadapt
    description: Plugin for removing adapter sequences, primers, and other unwanted sequence from sequence data.
    usage: qiime cutadapt [OPTIONS] COMMAND [ARGS]...
    options:
      - names:
          - --version
        argument: ""
        description: Show the version and exit.
      - names:
          - --example-data
        argument: PATH
        description: Write example data and exit.
      - names:
          - --citations
        argument: ""
        description: Show citations and exit.
      - names:
          - --help
        argument: ""
        description: Show this message and exit.
    subcommands:
      - name: demux-paired
        description: Demultiplex paired-end sequence data with barcodes in- sequence.
        usage: qiime cutadapt demux-paired [OPTIONS]
        options:
          - names:
              - --i-seqs
            argument: ARTIFACT MultiplexedPairedEndBarcodeInSequence
            description: The paired-end sequences to be demultiplexed. [required]
          - names:
              - --m-forward-barcodes-file
            argument: METADATA
            description: The sample metadata column listing the per-sample barcodes for the forward reads. [required]
          - names:
              - --m-forward-barcodes-column
            argument: COLUMN
            description: The sample metadata column listing the per-sample barcodes for the forward reads. [required]
          - names:
              - --m-reverse-barcodes-file
            argument: ""
            description: METADATA
          - names:
              - --m-reverse-barcodes-column
            argument: COLUMN
            description: The sample metadata column listing the per-sample barcodes for the reverse reads. [optional]
          - names:
              - --p-forward-cut
            argument: INTEGER
            description: 'Remove the specified number of bases from the forward sequences. Bases are removed before demultiplexing. If a positive value is provided, bases are removed from the beginning of the sequences. If a negative value is provided, bases are removed from the end of the sequences. If --p-mixed-orientation is set, then both --p-forward-cut and --p-reverse-cut must be set to the same value. [default: 0]'
          - names:
              - --p-reverse-cut
            argument: INTEGER
            description: 'Remove the specified number of bases from the reverse sequences. Bases are removed before demultiplexing. If a positive value is provided, bases are removed from the beginning of the sequences. If a negative value is provided, bases are removed from the end of the sequences. If --p-mixed-orientation is set, then both --p-forward-cut and --p-reverse-cut must be set to the same value. [default: 0]'
          - names:
              - --p-anchor-forward-barcode
              - --p-no-anchor-forward-barcode
            argument: ""
            description: 'Anchor the forward barcode. The barcode is then expected to occur in full length at the beginning (5'' end) of the forward sequence. Can speed up demultiplexing if used. [default: False]'
          - names:
              - --p-anchor-reverse-barcode
              - --p-no-anchor-reverse-barcode
            argument: ""
            description: 'Anchor the reverse barcode. The barcode is then expected to occur in full length at the beginning (5'' end) of the reverse sequence. Can speed up demultiplexing if used. [default: False]'
          - names:
              - --p-error-rate
            argument: PROPORTION
            description: 'The level of error tolerance, specified as the maximum allowable error rate. [default: 0.1]'
          - names:
              - --p-batch-size
            argument: INTEGER
            description: 'The number of samples cutadapt demultiplexes concurrently. Demultiplexing in smaller batches will yield the same result with marginal speed loss, and may solve "too many files" errors related to sample quantity. Set to "0" to process all samples at once. [default: 0]'
          - names:
              - --p-minimum-length
            argument: INTEGER
            description: 'Discard reads shorter than specified value. Note, the cutadapt default of 0 has been overridden, because that value produces empty sequence records. [default: 1]'
          - names:
              - --p-mixed-orientation
              - --p-no-mixed-orientation
            argument: ""
            description: 'Handle demultiplexing of mixed orientation reads (i.e. when forward and reverse reads coexist in the same file). [default: False]'
          - names:
              - --p-cores
            argument: NTHREADS
            description: 'Number of CPU cores to use. [default: 1]'
          - names:
              - --o-per-sample-sequences
            argument: ARTIFACT
            description: The resulting demultiplexed sequences. [required]
          - names:
              - --o-untrimmed-sequences
            argument: ARTIFACT MultiplexedPairedEndBarcodeInSequence
            description: The sequences that were unmatched to barcodes. [required]
          - names:
              - --output-dir
            argument: PATH
            description: Output unspecified results to a directory
          - names:
              - --verbose
              - --quiet
            argument: ""
            description: Display verbose output to stdout and/or stderr during execution of this action. Or silence output if execution is successful (silence is golden).
          - names:
              - --example-data
            argument: PATH
            description: Write example data and exit.
          - names:
              - --citations
            argument: ""
            description: Show citations and exit.
          - names:
              - --use-cache
            argument: DIRECTORY
            description: 'Specify the cache to be used for the intermediate work of this action. If not provided, the default cache under $TMP/qiime2/<uname> will be used. IMPORTANT FOR HPC USERS: If you are on an HPC system and are using parallel execution it is important to set this to a location that is globally accessible to all nodes in the cluster.'
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: demux-single
        description: Demultiplex single-end sequence data with barcodes in- sequence.
        usage: qiime cutadapt demux-single [OPTIONS]
        options:
          - names:
              - --i-seqs
            argument: ARTIFACT MultiplexedSingleEndBarcodeInSequence
            description: The single-end sequences to be demultiplexed. [required]
          - names:
              - --m-barcodes-file
