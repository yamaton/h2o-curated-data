          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: ancombc
        description: Analysis of Composition of Microbiomes with Bias Correction
        usage: qiime composition ancombc [OPTIONS]
        options:
          - names:
              - --i-table
            argument: ARTIFACT
            description: The feature table to be used for ANCOM-BC computation. [required]
          - names:
              - --m-metadata-file
            argument: METADATA...
            description: The sample metadata.
          - names:
              - --p-formula
            argument: TEXT
            description: How the microbial absolute abundances for each taxon depend on the variables within the `metadata`. [required]
          - names:
              - --p-p-adj-method
            argument: TEXT
            description: 'Method to adjust p-values. [default: ''holm'']'
          - names:
              - --p-prv-cut
            argument: NUMBER
            description: 'A numerical fraction between 0-1. Taxa with prevalences less than this value will be excluded from the analysis. [default: 0.1]'
          - names:
              - --p-lib-cut
            argument: INTEGER
            description: 'A numerical threshold for filtering samples based on library sizes. Samples with library sizes less than this value will be excluded from the analysis. [default: 0]'
          - names:
              - --p-reference-levels
            argument: TEXT...
            description: 'Define the reference level(s) to be used for categorical columns found in the `formula`. These categorical factors are dummy coded relative to the reference(s) provided. The syntax is as follows: [optional]'
          - names:
              - --p-tol
            argument: NUMBER
            description: 'The iteration convergence tolerance for the E-M algorithm. [default: 1e-05]'
          - names:
              - --p-max-iter
            argument: INTEGER
            description: 'The maximum number of iterations for the E-M algorithm. [default: 100]'
          - names:
              - --p-conserve
              - --p-no-conserve
            argument: ""
            description: 'Whether to use a conservative variance estimator for the test statistic. It is recommended if the sample size is small and/or the number of differentially abundant taxa is believed to be large. [default: False]'
          - names:
              - --p-alpha
            argument: NUMBER
            description: 'Level of significance. [default: 0.05]'
          - names:
              - --o-differentials
            argument: ARTIFACT
            description: The calculated per-feature differentials. [required]
          - names:
              - --output-dir
            argument: PATH
            description: Output unspecified results to a directory
          - names:
              - --verbose
              - --quiet
            argument: ""
            description: Display verbose output to stdout and/or stderr during execution of this action. Or silence output if execution is successful (silence is golden).
          - names:
              - --example-data
            argument: PATH
            description: Write example data and exit.
          - names:
              - --citations
            argument: ""
            description: Show citations and exit.
          - names:
              - --use-cache
            argument: DIRECTORY
            description: 'Specify the cache to be used for the intermediate work of this action. If not provided, the default cache under $TMP/qiime2/<uname> will be used. IMPORTANT FOR HPC USERS: If you are on an HPC system and are using parallel execution it is important to set this to a location that is globally accessible to all nodes in the cluster.'
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: ancombc2
        description: 'ANCOM-BC2: Analysis of Composition of Microbiomes with Bias Correction 2.'
        usage: qiime composition ancombc2 [OPTIONS]
        options:
          - names:
              - --i-table
            argument: ARTIFACT
            description: The feature table to be used for ANCOM-BC2 computation. [required]
          - names:
              - --m-metadata-file
            argument: METADATA...
            description: The per-sample metadata.
          - names:
              - --p-fixed-effects-formula
            argument: TEXT
            description: A formula that expresses how the feature absolute abundances in the feature table depend on the fixed effects of variables (columns) in the metadata. Do not include the dependent variable. Reference the `formula` function in the `stats` R package for a specification of valid formulae. [required]
          - names:
              - --p-random-effects-formula
            argument: TEXT
            description: A formula that expresses how the feature absolute abundances in the feature table depend on the random effects of variables (columns) in the metadata. Do not include the dependent variable. For example, to specify `MyVariable` as a random intercept use the syntax `(1 | MyVariable)`. Reference the `lmerTest` R package for a specification of valid formulae. [optional]
          - names:
              - --p-reference-levels
            argument: TEXT...
            description: Specify reference levels for one or more categorical metadata variables (columns). The method of specification is "column_name::column_value". E.g. "sex::female" sets the "female" category of the "sex" variable to be the reference level. Separate multiple specifications by spaces. [optional]
          - names:
              - --p-p-adjust-method
            argument: TEXT
            description: 'The method used to adjust p-values. Choose from "holm", "hochberg", "hommel", "bonferroni", "BH", "BY", "fdr", "none". See the `p.adjust` method in the `stats` R package for explanations of each option. [default: ''holm'']'
          - names:
              - --p-prevalence-cutoff
            argument: PROPORTION
            description: 'Features with prevalences less than this threshold will be excluded from the analysis. [default: 0.1]'
          - names:
              - --p-group
            argument: TEXT
            description: The name of the group variable in the metadata. The group variable must be categorical and is required to detect structural zeros. [optional]
          - names:
              - --p-structural-zeros
              - --p-no-structural-zeros
            argument: ""
            description: 'Whether to detect structurual zeros based on the `group` variable. Refer to the ANCOM-BC2 paper for an expalanation of the use of structural zeros. [default: False]'
          - names:
              - --p-asymptotic-cutoff
              - --p-no-asymptotic-cutoff
            argument: ""
            description: 'Whether to classify a taxon as a structural zero using its asymptotic lower bound. Generally, it is recommended to set this parameter when the sample size per group is relatively large (n > 30). When this parameter is not set, a feature is classified as a structural zero in a group if its frequency is zero in that group. See the ANCOM-BC2 publication for details. [default: False]'
          - names:
              - --p-diff-robust
              - --p-no-diff-robust
            argument: ""
            description: 'Whether to include `diff-robust` columns in the output. The `diff-robust` values are true where q < alpha AND sensitivity analysis was passed, and false otherwise. [default: False]'
          - names:
              - --p-num-processes
            argument: NTHREADS
            description: 'The number of processes to create that can be run in parallel. [default: 1]'
          - names:
              - --p-alpha
            argument: PROPORTION
            description: 'inclusive_end=True) The significance level. [default: 0.05]'
          - names:
              - --o-ancombc2-output
            argument: ARTIFACT
            description: The estimated log fold changes and their standard errors for the variables included in the mixed effects model. Also includes the structural zero designations if the `structural-zeros` parameter is passed. [required]
          - names:
              - --output-dir
            argument: PATH
            description: Output unspecified results to a directory
          - names:
              - --verbose
              - --quiet
            argument: ""
            description: Display verbose output to stdout and/or stderr during execution of this action. Or silence output if execution is successful (silence is golden).
          - names:
              - --example-data
            argument: PATH
            description: Write example data and exit.
          - names:
              - --citations
            argument: ""
            description: Show citations and exit.
          - names:
