name: qiime
description: Command line interface for QIIME 2
usage: qiime [OPTIONS] COMMAND [ARGS]...
options:
  - names:
      - --version
    argument: ""
    description: Show the version and exit.
  - names:
      - --help
    argument: ""
    description: Show this message and exit.
subcommands:
  - name: info
    description: Display information about current deployment.
    usage: qiime info [OPTIONS]
    options:
      - names:
          - --config-level
        argument: INTEGER RANGE
        description: 'The level of detail to be used for displaying the configuration summary. [default: 1; 0<=x<=3]'
      - names:
          - --help
        argument: ""
        description: Show this message and exit.
  - name: tools
    description: Tools for working with QIIME 2 files.
    usage: qiime tools [OPTIONS] COMMAND [ARGS]...
    options:
      - names:
          - --help
        argument: ""
        description: Show this message and exit.
    subcommands:
      - name: annotation-create
        description: Add a new Annotation to a QIIME 2 Result.
        usage: qiime tools annotation-create [OPTIONS]
        options:
          - names:
              - --input-path
            argument: ARTIFACT/VISUALIZATION
            description: Path to the `.qza` or `.qzv` you want to annotate. [required]
          - names:
              - --annotation-type
            argument: '[Note|Signature]'
            description: Annotation type to create. [required]
          - names:
              - --name
            argument: TEXT
            description: Name for your Annotation (must be unique for a given Result). [required]
          - names:
              - --text
            argument: TEXT
            description: Inline text for the Annotation. Mutually exclusive with `--file`.
          - names:
              - --file
            argument: FILE
            description: Path to a text file whose contents will be added to your Annotation. Mutually exclusive with `--text`.
          - names:
              - --fingerprint
            argument: TEXT
            description: Fingerprint of the keypair in GnuPG (spaces ok).
          - names:
              - --output-path
            argument: FILE
            description: 'Where to write the newly annotated result. [default: overwrite input file]'
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: annotation-fetch
        description: Fetch an Annotation from a QIIME 2 Result.
        usage: qiime tools annotation-fetch [OPTIONS]
        options:
          - names:
              - --input-path
            argument: FILE
            description: The `.qza` or `.qzv` to fetch the Annotation from. [required]
          - names:
              - --name
            argument: TEXT
            description: The name of the Annotation to fetch. [required]
          - names:
              - --verbose
              - --no-verbose
            argument: ""
            description: Whether to display the contents of the Annotation.
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: annotation-list
        description: List Annotations on a QIIME 2 Result.
        usage: qiime tools annotation-list [OPTIONS]
        options:
          - names:
              - --input-path
            argument: FILE
            description: The `.qza` or `.qzv` to list Annotations from. [required]
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: annotation-remove
        description: Remove an Annotation from a QIIME 2 Result.
        usage: qiime tools annotation-remove [OPTIONS]
        options:
          - names:
              - --input-path
            argument: FILE
            description: The `.qza` or `.qzv` from which to remove the Annotation. [required]
          - names:
              - --name
            argument: TEXT
            description: The name of the Annotation to remove. [required]
          - names:
              - --output-path
            argument: FILE
            description: 'Where to write the updated Result. [default: overwrite input filepath]'
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: cache-create
        description: Create an empty cache at the given location.
        usage: qiime tools cache-create [OPTIONS]
        options:
          - names:
              - --cache
            argument: PATH
            description: Path to a nonexistent directory to be created as a cache.
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: cache-export
        description: Export data from a QIIME 2 Artifact or a Visualization in a given cache under a given key.
        usage: qiime tools cache-export [OPTIONS]
        options:
          - names:
              - --cache
            argument: DIRECTORY
            description: Path to an existing cache to export from. [required]
          - names:
              - --key
            argument: TEXT
            description: The key of the Artifact or Visualization to export from the cache. [required]
          - names:
              - --output-path
            argument: PATH
            description: Path to file or directory data should be exported to. [required]
          - names:
              - --output-format
            argument: TEXT
            description: Format which the data should be exported as. This option cannot be used with Visualizations
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: cache-fetch
        description: Fetches an artifact out of a cache into a .qza.
        usage: qiime tools cache-fetch [OPTIONS]
        options:
          - names:
              - --cache
            argument: DIRECTORY
            description: Path to an existing cache to load from. [required]
          - names:
              - --key
            argument: TEXT
            description: The key to the artifact being loaded. [required]
          - names:
              - --output-path
            argument: PATH
            description: Path to put the .qza we are loading the artifact into. [required]
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: cache-garbage-collection
        description: Runs garbage collection on the cache at the specified location.
        usage: qiime tools cache-garbage-collection [OPTIONS]
        options:
          - names:
              - --cache
            argument: DIRECTORY
            description: Path to an existing cache to run garbage collection on.
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: cache-import
        description: Imports data into an Artifact in the cache under a key.
        usage: qiime tools cache-import [OPTIONS]
        options:
          - names:
              - --type
            argument: TEXT
            description: The semantic type of the artifact that will be created upon importing. Use `qiime tools list-types` to see what importable semantic types are available in the current deployment. [required]
          - names:
              - --input-path
            argument: PATH
            description: Path to file or directory that should be imported. [required]
          - names:
              - --cache
            argument: DIRECTORY
            description: Path to an existing cache to save into. [required]
          - names:
              - --key
            argument: TEXT
            description: The key to save the artifact under (must be a valid Python identifier). [required]
          - names:
              - --input-format
            argument: TEXT
            description: The format of the data to be imported. If not provided, data must be in the format expected by the semantic type provided via --type. Use `qiime tools list-formats --importable` to see which formats of input data are importable.
          - names:
              - --validate-level
            argument: '[min|max]'
            description: 'How much to validate the imported data before creating the artifact. A value of "max" will generally read the entire file or directory, whereas "min" will not usually do so. [default: "max"]'
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: cache-remove
        description: Removes a given key from a cache.
        usage: qiime tools cache-remove [OPTIONS]
        options:
          - names:
              - --cache
            argument: DIRECTORY
            description: Path to an existing cache to remove the key from. [required]
          - names:
              - --key
            argument: TEXT
            description: The key to remove from the cache. Pass `key` parameter multiple times to remove multiple keys. [required]
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: cache-status
        description: Checks the status of the cache.
        usage: qiime tools cache-status [OPTIONS]
        options:
          - names:
              - --cache
            argument: DIRECTORY
            description: Path to an existing cache to check the status of.
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: cache-store
        description: Stores a .qza in the cache under a key.
        usage: qiime tools cache-store [OPTIONS]
        options:
          - names:
              - --cache
            argument: DIRECTORY
            description: Path to an existing cache to save into. [required]
          - names:
              - --artifact-path
            argument: FILE
            description: Path to a .qza to save into the cache. [required]
          - names:
              - --key
            argument: TEXT
            description: The key to save the artifact under (must be a valid Python identifier). [required]
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: cast-metadata
        description: Designate metadata column types.
        usage: qiime tools cast-metadata [OPTIONS] METADATA...
        options:
          - names:
              - --cast
            argument: COLUMN:TYPE
            description: 'Parameter for each metadata column that should be cast as a specified column type (supported types are as follows: categorical, numeric). The required formatting for this parameter is --cast COLUMN:TYPE, repeated for each column and the associated column type it should be cast to in the output. [required]'
          - names:
              - --ignore-extra
            argument: ""
            description: If this flag is enabled, cast parameters that do not correspond to any of the column names within the provided metadata will be ignored.
          - names:
              - --error-on-missing
            argument: ""
            description: If this flag is enabled, failing to include cast parameters for all columns in the provided metadata will result in an error.
          - names:
              - --output-file
            argument: FILE
            description: Path to file where the modified metadata should be written to.
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: citations
        description: Print citations for a QIIME 2 result.
        usage: qiime tools citations [OPTIONS] ARTIFACT/VISUALIZATION
        options:
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: export
        description: Export data from a QIIME 2 Artifact or a Visualization
        usage: qiime tools export [OPTIONS]
        options:
          - names:
              - --input-path
            argument: ARTIFACT/VISUALIZATION
            description: Path to file that should be exported [required]
          - names:
              - --output-path
            argument: PATH
            description: Path to file or directory where data should be exported to [required]
          - names:
              - --output-format
            argument: TEXT
            description: Format which the data should be exported as. This option cannot be used with Visualizations
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: extract
        description: Extract a QIIME 2 Artifact or Visualization archive.
        usage: qiime tools extract [OPTIONS]
        options:
          - names:
              - --input-path
            argument: ARTIFACT/VISUALIZATION
            description: Path to file that should be extracted [required]
          - names:
              - --output-path
            argument: DIRECTORY
            description: 'Directory where archive should be extracted to [default: current working directory]'
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: import
        description: Import data into a new QIIME 2 Artifact.
        usage: qiime tools import [OPTIONS]
        options:
          - names:
              - --type
            argument: TEXT
            description: The semantic type of the artifact that will be created upon importing. Use `qiime tools list-types` to see what importable semantic types are available in the current deployment. [required]
          - names:
              - --input-path
            argument: PATH
            description: Path to file or directory that should be imported. [required]
          - names:
              - --output-path
            argument: ARTIFACT
            description: Path where output artifact should be written. [required]
          - names:
              - --input-format
            argument: TEXT
            description: The format of the data to be imported. If not provided, data must be in the format expected by the semantic type provided via --type. Use `qiime tools list-formats --importable` to see which formats of input data are importable.
          - names:
              - --validate-level
            argument: '[min|max]'
            description: 'How much to validate the imported data before creating the artifact. A value of "max" will generally read the entire file or directory, whereas "min" will not usually do so. [default: "max"]'
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: inspect-metadata
        description: Inspect columns available in metadata.
        usage: qiime tools inspect-metadata [OPTIONS] METADATA...
        options:
          - names:
              - --tsv
              - --no-tsv
            argument: ""
            description: Print as machine-readable TSV instead of text.
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: list-formats
        description: List the available formats.
        usage: qiime tools list-formats [OPTIONS] [QUERIES]...
        options:
          - names:
              - --importable
            argument: ""
            description: List the importable formats.
          - names:
              - --exportable
            argument: ""
            description: List the exportable formats.
          - names:
              - --strict
            argument: ""
            description: Show only exact matches for the format argument(s).
          - names:
              - --tsv
            argument: ""
            description: Print as machine readable tab-separated values.
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: list-types
        description: List the available semantic types.
        usage: qiime tools list-types [OPTIONS] [QUERIES]...
        options:
          - names:
              - --strict
            argument: ""
            description: Show only exact matches for the type argument(s).
          - names:
              - --tsv
            argument: ""
            description: Print as machine readable tab-separated values.
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: make-report
        description: Make a QIIME 2 Report.
        usage: qiime tools make-report [OPTIONS] VIZ
        options:
          - names:
              - --report-path
            argument: REPORT
            description: Path where output report should be written. [required]
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: peek
        description: Take a peek at a QIIME 2 Artifact or Visualization.
        usage: qiime tools peek [OPTIONS] ARTIFACT/VISUALIZATION
        options:
          - names:
              - --tsv
              - --no-tsv
            argument: ""
            description: Print as machine-readable tab-separated values.
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: replay-citations
        description: Reports all citations from a QIIME 2 Artifact...
        usage: qiime tools replay-citations [OPTIONS]
        options:
          - names:
              - --in-fp
            argument: TEXT
            description: filepath to a QIIME 2 Archive (.qza or .qzv) or directory of Archives [required]
          - names:
              - --recurse
              - --no-recurse
            argument: ""
            description: 'if in-fp is a directory, will also search sub-directories when finding Archives to parse [default: no-recurse]'
          - names:
              - --deduplicate
              - --no-deduplicate
            argument: ""
            description: 'If deduplicate, duplicate citations will be removed heuristically, e.g. by comparing DOI fields. This greatly reduces manual curation of reference lists, but introduces a small risk of reference loss. [default: deduplicate]'
          - names:
              - --suppress-header
              - --no-suppress-header
            argument: ""
            description: 'do not write header/footer blocks in the output script [default: no-suppress-header]'
          - names:
              - --verbose
              - --no-verbose
            argument: ""
            description: 'print status messages to stdout while processing [default: verbose]'
          - names:
              - --out-fp
            argument: PATH
            description: the filepath where your bibtex file should be written [required]
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: replay-provenance
        description: Replay provenance from a QIIME 2 Artifact...
        usage: qiime tools replay-provenance [OPTIONS]
        options:
          - names:
              - --in-fp
            argument: TEXT
            description: filepath to a QIIME 2 Archive (.qza or .qzv) or directory of Archives [required]
          - names:
              - --recurse
              - --no-recurse
            argument: ""
            description: 'if in-fp is a directory, will also search sub-directories when finding Archives to parse [default: no-recurse]'
          - names:
              - --usage-driver
            argument: '[python3|cli]'
            description: 'the target interface for your replay script [default: cli]'
          - names:
              - --validate-checksums
              - --no-validate-checksums
            argument: ""
            description: 'check that replayed archives are intact and uncorrupted [default: validate-checksums]'
          - names:
              - --parse-metadata
              - --no-parse-metadata
            argument: ""
            description: 'parse the original metadata captured in provenance for review or replay [default: parse-metadata]'
          - names:
              - --use-recorded-metadata
              - --no-use-recorded-metadata
            argument: ""
            description: 're-use the original metadata captured in provenance [default: no-use-recorded-metadata]'
          - names:
              - --suppress-header
              - --no-suppress-header
            argument: ""
            description: 'do not write header/footer blocks in the output script [default: no-suppress-header]'
          - names:
              - --verbose
              - --no-verbose
            argument: ""
            description: 'print status messages to stdout while processing [default: verbose]'
          - names:
              - --dump-recorded-metadata
              - --no-dump-recorded-metadata
            argument: ""
            description: 'write the original metadata captured in provenance to disk in the --metadata-out-dir directory [default: dump-recorded-metadata]'
          - names:
              - --metadata-out-dir
            argument: TEXT
            description: 'the directory where captured study metadata should be written if --dump-recorded-metadata. This often produces many outputs, so a dedicated directory should generally be used. Creates the directory if it does not already exist. By default, metadata is written to `${PWD}/recorded_metadata/` [default: ""]'
          - names:
              - --out-fp
            argument: PATH
            description: the filepath where your replay script should be written [required]
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: replay-supplement
        description: Produces a zipfile package of useful...
        usage: qiime tools replay-supplement [OPTIONS]
        options:
          - names:
              - --in-fp
            argument: TEXT
            description: filepath to a QIIME 2 Archive or directory of Archives [required]
          - names:
              - --recurse
              - --no-recurse
            argument: ""
            description: 'if in-fp is a directory, will also search sub-directories when finding .qza/.qzv files to parse [default: no-recurse]'
          - names:
              - --deduplicate
              - --no-deduplicate
            argument: ""
            description: 'If deduplicate, duplicate citations will be removed heuristically, e.g. by comparing DOI fields. This greatly reduces manual curation of reference lists, but introduces a small risk of reference loss. [default: deduplicate]'
          - names:
              - --validate-checksums
              - --no-validate-checksums
            argument: ""
            description: 'check that replayed archives are intact and uncorrupted [default: validate-checksums]'
          - names:
              - --parse-metadata
              - --no-parse-metadata
            argument: ""
            description: 'parse the original metadata captured in provenance for review or replay [default: parse-metadata]'
          - names:
              - --use-recorded-metadata
              - --no-use-recorded-metadata
            argument: ""
            description: 're-use the original metadata captured in provenance [default: no-use-recorded-metadata]'
          - names:
              - --suppress-header
              - --no-suppress-header
            argument: ""
            description: 'do not write header/footer blocks in the output script [default: no-suppress-header]'
          - names:
              - --verbose
              - --no-verbose
            argument: ""
            description: 'print status messages to stdout while processing [default: verbose]'
          - names:
              - --dump-recorded-metadata
              - --no-dump-recorded-metadata
            argument: ""
            description: 'write the original metadata captured in provenance to recorded_metadata/ inside the archive [default: dump-recorded-metadata]'
          - names:
              - --out-fp
            argument: PATH
            description: the filepath where your reproduciblity supplement zipfile should be written [required]
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: signature-verify
        description: Verify a Signature Annotation on a QIIME 2 Result.
        usage: qiime tools signature-verify [OPTIONS]
        options:
          - names:
              - --input-path
            argument: FILE
            description: The `.qza` or `.qzv` to verify a Signature from.
          - names:
              - --name
            argument: TEXT
            description: The name of the Signature to verify. [required]
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: validate
        description: Validate data in a QIIME 2 Artifact.
        usage: qiime tools validate [OPTIONS] ARTIFACT/VISUALIZATION
        options:
          - names:
              - --level
            argument: '[min|max]'
            description: 'Desired level of validation. "min" will perform minimal validation, and "max" will perform maximal validation (at the potential cost of runtime). [default: max]'
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: view
        description: View a QIIME 2 Result.
        usage: qiime tools view [OPTIONS] RESULT
        options:
          - names:
              - --port
            argument: INTEGER RANGE
            description: The port to serve the webapp on. [1024<=x<=65535]
          - names:
              - --verbose
            argument: ""
            description: Display all GET requests in the terminal.
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
  - name: dev
    description: Utilities for developers and advanced users.
    usage: qiime dev [OPTIONS] COMMAND [ARGS]...
    options:
      - names:
          - --help
        argument: ""
        description: Show this message and exit.
    subcommands:
      - name: assert-result-data
        description: Assert expression in Result.
        usage: qiime dev assert-result-data [OPTIONS] ARTIFACT/VISUALIZATION
        options:
          - names:
              - --zip-data-path
            argument: TEXT
            description: The path within the zipped Result's data/ directory that should be searched. [required]
          - names:
              - --expression
            argument: TEXT
            description: The Python regular expression to match. [required]
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: assert-result-type
        description: Assert Result is a specific type.
        usage: qiime dev assert-result-type [OPTIONS] ARTIFACT/VISUALIZATION
        options:
          - names:
              - --qiime-type
            argument: TEXT
            description: QIIME 2 data type. [required]
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: export-default-theme
        description: Export the default settings.
        usage: qiime dev export-default-theme [OPTIONS]
        options:
          - names:
              - --output-path
            argument: FILE
            description: Path to output the config to [required]
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: import-theme
        description: Install new command line theme.
        usage: qiime dev import-theme [OPTIONS]
        options:
          - names:
              - --theme
            argument: FILE
            description: Path to file containing new theme info [required]
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: refresh-cache
        description: Refresh CLI cache.
        usage: qiime dev refresh-cache [OPTIONS]
        options:
          - names:
              - --help
            argument: ""
            description: Show this message and exit.
      - name: reset-theme
        description: Reset command line theme to default.
        usage: qiime dev reset-theme [OPTIONS]
        options:
          - names:
              - --yes
            argument: ""
            description: --help Show this message and exit.
  - name: alignment
    description: Plugin for generating and manipulating alignments.
    usage: qiime alignment [OPTIONS] COMMAND [ARGS]...
    options:
      - names:
          - --version
        argument: ""
        description: Show the version and exit.
      - names:
          - --example-data
        argument: PATH
        description: Write example data and exit.
      - names:
          - --citations
        argument: ""
        description: Show citations and exit.
      - names:
          - --help
        argument: ""
        description: Show this message and exit.
    subcommands:
      - name: mafft
        description: De novo multiple sequence alignment with MAFFT
        usage: qiime alignment mafft [OPTIONS]
        options:
          - names:
              - --i-sequences
            argument: ARTIFACT
            description: The sequences to be aligned. [required]
          - names:
              - --p-n-threads
            argument: NTHREADS
            description: 'The number of threads. (Use `auto` to automatically use all available cores) [default: 1]'
          - names:
              - --p-parttree
              - --p-no-parttree
            argument: ""
            description: 'This flag is required if the number of sequences being aligned are larger than 1,000,000. Disabled by default. [default: False]'
          - names:
              - --p-large
              - --p-no-large
            argument: ""
            description: 'This flag is required when aligning very large datasets that do not otherwise fit into memory. Temporary data is then stored in files, instead of RAM. The --use-cache flag specifies the storage location of the temporary files created. By default, $TMP/qiime2/ is used. [default: False]'
          - names:
              - --p-strategy
            argument: TEXT
            description: 'Specifies the multiple alignment strategy to use. Exactly one strategy may be specified. Valid options are: ''auto'', ''nofft'', ''globalpair'', ''localpair'', and ''genafpair''. Default strategy: FFT-NS. [optional]'
          - names:
              - --p-maxiterate
            argument: INTEGER
            description: Specifies how many iterative refinement cycles are performed after the initial progressive alignment. By default, no iterative refinement is performed. [optional]
          - names:
              - --p-retree
            argument: INTEGER
            description: Specifies the number of times the guide tree is rebuilt during the progressive stage. Typically, tree topology stabilizes after 2-3 iterations and higher values rarely improves alignment quality enough to justify the extra computation. [optional]
          - names:
              - --o-alignment
            argument: ARTIFACT
            description: The aligned sequences. [required]
          - names:
              - --output-dir
