            description: 'Trim trailing Poly G tails from 3 prime end. Continues to trim nucleotides with Phred score quality lower than threshold after the tail. Note that this should not be used in conjunction with `quality-cutoff-3end` as both trim from the 3 prime end. [default: 0]'
