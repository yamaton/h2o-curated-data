      - name: dereplicate
        description: Dereplicate features with matching sequences and taxonomies.
        usage: qiime rescript dereplicate [OPTIONS]
        options:
          - names:
              - --i-sequences
            argument: ARTIFACT
            description: Sequences to be dereplicated [required]
          - names:
              - --i-taxa
            argument: ARTIFACT
            description: Taxonomic classifications of sequences to be dereplicated [required]
          - names:
              - --p-mode
            argument: TEXT
            description: 'How to handle dereplication when sequences map to distinct taxonomies. "uniq" will retain all sequences with unique taxonomic affiliations. "lca" will find the least common ancestor among all taxa sharing a sequence. "majority" will find the most common taxonomic label associated with that sequence; note that in the event of a tie, "majority" will pick the winner arbitrarily. "super" finds the LCA consensus while giving preference to majority labels and collapsing substrings into superstrings. For example, when a more specific taxonomy does not contradict a less specific taxonomy, the more specific is chosen. That is, "g__Faecalibacterium; s__prausnitzii", will be preferred over "g__Faecalibacterium; s__" [default: ''uniq'']'
          - names:
              - --p-perc-identity
            argument: PROPORTION
            description: 'The percent identity at which clustering should be performed. This parameter maps to vsearch''s --id parameter. [default: 1.0]'
          - names:
              - --p-threads
            argument: INTEGER
            description: 'Number of computation threads to use (1 to 256). The number of threads should be lesser or equal to the number of available CPU cores. [default: 1]'
          - names:
              - --p-rank-handles
            argument: VALUES... List
            description: '| List[Str %   Specifies the set of rank handles used to backfill missing ranks in the resulting dereplicated taxonomy. Use ''disable'' to prevent applying ''rank-handles''.'
          - names:
              - --p-derep-prefix
              - --p-no-derep-prefix
            argument: ""
            description: 'Merge sequences with identical prefixes. If a sequence is identical to the prefix of two or more longer sequences, it is clustered with the shortest of them. If they are equally long, it is clustered with the most abundant. [default: False]'
          - names:
              - --o-dereplicated-sequences
            argument: ARTIFACT FeatureData
            description: '[required]'
          - names:
              - --o-dereplicated-sequences
            argument: ARTIFACT FeatureDataSequence
            description: '[required]'
          - names:
              - --o-dereplicated-taxa
            argument: ARTIFACT FeatureData
            description: '[required]'
          - names:
              - --o-dereplicated-taxa
            argument: ARTIFACT FeatureDataTaxonomy
            description: '[required]'
          - names:
              - --output-dir
            argument: PATH
            description: Output unspecified results to a directory
          - names:
              - --verbose
              - --quiet
            argument: ""
            description: Display verbose output to stdout and/or stderr during execution of this action. Or silence output if execution is successful (silence is golden).
          - names:
              - --example-data
            argument: PATH
            description: Write example data and exit.
          - names:
