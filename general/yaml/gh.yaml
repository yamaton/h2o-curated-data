name: gh
description: GitHub CLI
usage: gh <command> <subcommand> [flags]
options:
  - names:
      - --help
    argument: ""
    description: Show help for command
  - names:
      - --version
    argument: ""
    description: Show gh version
subcommands:
  - name: auth
    description: Authenticate gh and git with GitHub
    usage: gh auth <command> [flags]
    options:
      - names:
          - --help
        argument: ""
        description: Show help for command
    subcommands:
      - name: login
        description: Log in to a GitHub account
        usage: gh auth login [flags]
        options:
          - names:
              - -p
              - --git-protocol
            argument: string
            description: 'The protocol to use for git operations on this host: {ssh|https}'
          - names:
              - -h
              - --hostname
            argument: string
            description: The hostname of the GitHub instance to authenticate with
          - names:
              - --insecure-storage
            argument: ""
            description: Save authentication credentials in plain text instead of credential store
          - names:
              - -s
              - --scopes
            argument: strings
            description: Additional authentication scopes to request
          - names:
              - --skip-ssh-key
            argument: ""
            description: Skip generate/upload SSH key prompt
          - names:
              - -w
              - --web
            argument: ""
            description: Open a browser to authenticate
          - names:
              - --with-token
            argument: ""
            description: Read token from standard input
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: logout
        description: Log out of a GitHub account
        usage: gh auth logout [flags]
        options:
          - names:
              - -h
              - --hostname
            argument: string
            description: The hostname of the GitHub instance to log out of
          - names:
              - -u
              - --user
            argument: string
            description: The account to log out of
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: refresh
        description: Refresh stored authentication credentials
        usage: gh auth refresh [flags]
        options:
          - names:
              - -h
              - --hostname
            argument: string
            description: The GitHub host to use for authentication
          - names:
              - --insecure-storage
            argument: ""
            description: Save authentication credentials in plain text instead of credential store
          - names:
              - -r
              - --remove-scopes
            argument: strings
            description: Authentication scopes to remove from gh
          - names:
              - --reset-scopes
            argument: ""
            description: Reset authentication scopes to the default minimum set of scopes
          - names:
              - -s
              - --scopes
            argument: strings
            description: Additional authentication scopes for gh to have
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: setup-git
        description: Setup git with GitHub CLI
        usage: gh auth setup-git [flags]
        options:
          - names:
              - -f
              - --force
              - --hostname
            argument: ""
            description: Force setup even if the host is not known. Must be used in conjunction with --hostname
          - names:
              - -h
              - --hostname
            argument: string
            description: The hostname to configure git for
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: status
        description: Display active account and authentication state on each known GitHub host
        usage: gh auth status [flags]
        options:
          - names:
              - -a
              - --active
            argument: ""
            description: Display the active account only
          - names:
              - -h
              - --hostname
            argument: string
            description: Check only a specific hostname's auth status
          - names:
              - -t
              - --show-token
            argument: ""
            description: Display the auth token
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: switch
        description: Switch active GitHub account
        usage: gh auth switch [flags]
        options:
          - names:
              - -h
              - --hostname
            argument: string
            description: The hostname of the GitHub instance to switch account for
          - names:
              - -u
              - --user
            argument: string
            description: The account to switch to
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: token
        description: Print the authentication token gh uses for a hostname and account
        usage: gh auth token [flags]
        options:
          - names:
              - -h
              - --hostname
            argument: string
            description: The hostname of the GitHub instance authenticated with
          - names:
              - -u
              - --user
            argument: string
            description: The account to output the token for
          - names:
              - --help
            argument: ""
            description: Show help for command
  - name: browse
    description: Open the repository in the browser
    usage: gh browse [<number> | <path> | <commit-SHA>] [flags]
    options:
      - names:
          - -b
          - --branch
        argument: string
        description: Select another branch by passing in the branch name
      - names:
          - -c
          - --commit
        argument: string[="last"]
        description: Select another commit by passing in the commit SHA, default is the last commit
      - names:
          - -n
          - --no-browser
        argument: ""
        description: Print destination URL instead of opening the browser
      - names:
          - -p
          - --projects
        argument: ""
        description: Open repository projects
      - names:
          - -r
          - --releases
        argument: ""
        description: Open repository releases
      - names:
          - -R
          - --repo
        argument: '[HOST/]OWNER/REPO'
        description: Select another repository using the [HOST/]OWNER/REPO format
      - names:
          - -s
          - --settings
        argument: ""
        description: Open repository settings
      - names:
          - -w
          - --wiki
        argument: ""
        description: Open repository wiki
      - names:
          - --help
        argument: ""
        description: Show help for command
  - name: codespace
    description: Connect to and manage codespaces
    usage: gh codespace [flags]
    options:
      - names:
          - --help
        argument: ""
        description: Show help for command
    subcommands:
      - name: code
        description: Open a codespace in Visual Studio Code
        usage: gh codespace code [flags]
        options:
          - names:
              - -c
              - --codespace
            argument: string
            description: Name of the codespace
          - names:
              - --insiders
            argument: ""
            description: Use the insiders version of Visual Studio Code
          - names:
              - -R
              - --repo
            argument: string
            description: Filter codespace selection by repository name (user/repo)
          - names:
              - --repo-owner
            argument: string
            description: Filter codespace selection by repository owner (username or org)
          - names:
              - -w
              - --web
            argument: ""
            description: Use the web version of Visual Studio Code
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: cp
        description: Copy files between local and remote file systems
        usage: gh codespace cp [-e] [-r] [-- [<scp flags>...]] <sources>... <dest>
        options:
          - names:
              - -c
              - --codespace
            argument: string
            description: Name of the codespace
          - names:
              - -e
              - --expand
            argument: ""
            description: Expand remote file names on remote shell
          - names:
              - -p
              - --profile
            argument: string
            description: Name of the SSH profile to use
          - names:
              - -r
              - --recursive
            argument: ""
            description: Recursively copy directories
          - names:
              - -R
              - --repo
            argument: string
            description: Filter codespace selection by repository name (user/repo)
          - names:
              - --repo-owner
            argument: string
            description: Filter codespace selection by repository owner (username or org)
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: create
        description: Create a codespace
        usage: gh codespace create [flags]
        options:
          - names:
              - -b
              - --branch
            argument: string
            description: repository branch
          - names:
              - --default-permissions
            argument: ""
            description: do not prompt to accept additional permissions requested by the codespace
          - names:
              - --devcontainer-path
            argument: string
            description: path to the devcontainer.json file to use when creating codespace
          - names:
              - -d
              - --display-name
            argument: string
            description: display name for the codespace (48 characters or less)
          - names:
              - --idle-timeout
            argument: duration
            description: allowed inactivity before codespace is stopped, e.g. "10m", "1h"
          - names:
              - -l
              - --location
            argument: string
            description: 'location: {EastUs|SouthEastAsia|WestEurope|WestUs2} (determined automatically if not provided)'
          - names:
              - -m
              - --machine
            argument: string
            description: hardware specifications for the VM
          - names:
              - -R
              - --repo
            argument: string
            description: 'repository name with owner: user/repo'
          - names:
              - --retention-period
            argument: duration
            description: allowed time after shutting down before the codespace is automatically deleted (maximum 30 days), e.g. "1h", "72h"
          - names:
              - -s
              - --status
            argument: ""
            description: show status of post-create command and dotfiles
          - names:
              - -w
              - --web
            argument: ""
            description: create codespace from browser, cannot be used with --display-name, --idle-timeout, or --retention-period
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: delete
        description: Delete codespaces
        usage: gh codespace delete [flags]
        options:
          - names:
              - --all
            argument: ""
            description: Delete all codespaces
          - names:
              - -c
              - --codespace
            argument: string
            description: Name of the codespace
          - names:
              - --days
            argument: "N"
            description: Delete codespaces older than N days
          - names:
              - -f
              - --force
            argument: ""
            description: Skip confirmation for codespaces that contain unsaved changes
          - names:
              - -o
              - --org
            argument: login
            description: The login handle of the organization (admin-only)
          - names:
              - -R
              - --repo
            argument: string
            description: Filter codespace selection by repository name (user/repo)
          - names:
              - --repo-owner
            argument: string
            description: Filter codespace selection by repository owner (username or org)
          - names:
              - -u
              - --user
            argument: username
            description: The username to delete codespaces for (used with --org)
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: edit
        description: Edit a codespace
        usage: gh codespace edit [flags]
        options:
          - names:
              - -c
              - --codespace
            argument: string
            description: Name of the codespace
          - names:
              - -d
              - --display-name
            argument: string
            description: Set the display name
          - names:
              - -m
              - --machine
            argument: string
            description: Set hardware specifications for the VM
          - names:
              - -R
              - --repo
            argument: string
            description: Filter codespace selection by repository name (user/repo)
          - names:
              - --repo-owner
            argument: string
            description: Filter codespace selection by repository owner (username or org)
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: jupyter
        description: Open a codespace in JupyterLab
        usage: gh codespace jupyter [flags]
        options:
          - names:
              - -c
              - --codespace
            argument: string
            description: Name of the codespace
          - names:
              - -R
              - --repo
            argument: string
            description: Filter codespace selection by repository name (user/repo)
          - names:
              - --repo-owner
            argument: string
            description: Filter codespace selection by repository owner (username or org)
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: list
        description: List codespaces
        usage: gh codespace list [flags]
        options:
          - names:
              - -q
              - --jq
            argument: expression
            description: Filter JSON output using a jq expression
          - names:
              - --json
            argument: fields
            description: Output JSON with the specified fields
          - names:
              - -L
              - --limit
            argument: int
            description: Maximum number of codespaces to list (default 30)
          - names:
              - -o
              - --org
            argument: login
            description: The login handle of the organization to list codespaces for (admin-only)
          - names:
              - -R
              - --repo
            argument: string
            description: 'Repository name with owner: user/repo'
          - names:
              - -t
              - --template
            argument: string
            description: Format JSON output using a Go template; see "gh help formatting"
          - names:
              - -u
              - --user
            argument: username
            description: The username to list codespaces for (used with --org)
          - names:
              - -w
              - --web
            argument: ""
            description: List codespaces in the web browser, cannot be used with --user or --org
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: logs
        description: Access codespace logs
        usage: gh codespace logs [flags]
        options:
          - names:
              - -c
              - --codespace
            argument: string
            description: Name of the codespace
          - names:
              - -f
              - --follow
            argument: ""
            description: Tail and follow the logs
          - names:
              - -R
              - --repo
            argument: string
            description: Filter codespace selection by repository name (user/repo)
          - names:
              - --repo-owner
            argument: string
            description: Filter codespace selection by repository owner (username or org)
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: ports
        description: List ports in a codespace
        usage: gh codespace ports [flags]
        options:
          - names:
              - -c
              - --codespace
            argument: string
            description: Name of the codespace
          - names:
              - -q
              - --jq
            argument: expression
            description: Filter JSON output using a jq expression
          - names:
              - --json
            argument: fields
            description: Output JSON with the specified fields
          - names:
              - -R
              - --repo
            argument: string
            description: Filter codespace selection by repository name (user/repo)
          - names:
              - --repo-owner
            argument: string
            description: Filter codespace selection by repository owner (username or org)
          - names:
              - -t
              - --template
            argument: string
            description: Format JSON output using a Go template; see "gh help formatting"
          - names:
              - --help
            argument: ""
            description: Show help for command
        subcommands:
          - name: forward
            description: Forward ports
            usage: gh codespace ports forward <remote-port>:<local-port>... [flags]
            options:
              - names:
                  - -c
                  - --codespace
                argument: string
                description: Name of the codespace
              - names:
                  - --help
                argument: ""
                description: Show help for command
              - names:
                  - -R
                  - --repo
                argument: string
                description: Filter codespace selection by repository name (user/repo)
              - names:
                  - --repo-owner
                argument: string
                description: Filter codespace selection by repository owner (username or org)
          - name: visibility
            description: Change the visibility of the forwarded port
            usage: gh codespace ports visibility <port>:{public|private|org}... [flags]
            options:
              - names:
                  - -c
                  - --codespace
                argument: string
                description: Name of the codespace
              - names:
                  - --help
                argument: ""
                description: Show help for command
              - names:
                  - -R
                  - --repo
                argument: string
                description: Filter codespace selection by repository name (user/repo)
              - names:
                  - --repo-owner
                argument: string
                description: Filter codespace selection by repository owner (username or org)
      - name: rebuild
        description: Rebuild a codespace
        usage: gh codespace rebuild [flags]
        options:
          - names:
              - -c
              - --codespace
            argument: string
            description: Name of the codespace
          - names:
              - --full
            argument: ""
            description: perform a full rebuild
          - names:
              - -R
              - --repo
            argument: string
            description: Filter codespace selection by repository name (user/repo)
          - names:
              - --repo-owner
            argument: string
            description: Filter codespace selection by repository owner (username or org)
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: ssh
        description: SSH into a codespace
        usage: gh codespace ssh [<flags>...] [-- <ssh-flags>...] [<command>]
        options:
          - names:
              - -c
              - --codespace
            argument: string
            description: Name of the codespace
          - names:
              - --config
            argument: ""
            description: Write OpenSSH configuration to stdout
          - names:
              - -d
              - --debug
            argument: ""
            description: Log debug data to a file
          - names:
              - --debug-file
            argument: string
            description: Path of the file log to
          - names:
              - --profile
            argument: string
            description: Name of the SSH profile to use
          - names:
              - -R
              - --repo
            argument: string
            description: Filter codespace selection by repository name (user/repo)
          - names:
              - --repo-owner
            argument: string
            description: Filter codespace selection by repository owner (username or org)
          - names:
              - --server-port
            argument: int
            description: SSH server port number (0 => pick unused)
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: stop
        description: Stop a running codespace
        usage: gh codespace stop [flags]
        options:
          - names:
              - -c
              - --codespace
            argument: string
            description: Name of the codespace
          - names:
              - -o
              - --org
            argument: login
            description: The login handle of the organization (admin-only)
          - names:
              - -R
              - --repo
            argument: string
            description: Filter codespace selection by repository name (user/repo)
          - names:
              - --repo-owner
            argument: string
            description: Filter codespace selection by repository owner (username or org)
          - names:
              - -u
              - --user
            argument: username
            description: The username to stop codespace for (used with --org)
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: view
        description: View details about a codespace
        usage: gh codespace view [flags]
        options:
          - names:
              - -c
              - --codespace
            argument: string
            description: Name of the codespace
          - names:
              - -q
              - --jq
            argument: expression
            description: Filter JSON output using a jq expression
          - names:
              - --json
            argument: fields
            description: Output JSON with the specified fields
          - names:
              - -R
              - --repo
            argument: string
            description: Filter codespace selection by repository name (user/repo)
          - names:
              - --repo-owner
            argument: string
            description: Filter codespace selection by repository owner (username or org)
          - names:
              - -t
              - --template
            argument: string
            description: Format JSON output using a Go template; see "gh help formatting"
          - names:
              - --help
            argument: ""
            description: Show help for command
  - name: gist
    description: Manage gists
    usage: gh gist <command> [flags]
    options:
      - names:
          - --help
        argument: ""
        description: Show help for command
    subcommands:
      - name: clone
        description: Clone a gist locally
        usage: gh gist clone <gist> [<directory>] [-- <gitflags>...]
        options:
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: create
        description: Create a new gist
        usage: gh gist create [<filename>... | -] [flags]
        options:
          - names:
              - -d
              - --desc
            argument: string
            description: A description for this gist
          - names:
              - -f
              - --filename
            argument: string
            description: Provide a filename to be used when reading from standard input
          - names:
              - -p
              - --public
            argument: ""
            description: List the gist publicly (default "secret")
          - names:
              - -w
              - --web
            argument: ""
            description: Open the web browser with created gist
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: delete
        description: Delete a gist
        usage: gh gist delete {<id> | <url>} [flags]
        options:
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: edit
        description: Edit one of your gists
        usage: gh gist edit {<id> | <url>} [<filename>] [flags]
        options:
          - names:
              - -a
              - --add
            argument: string
            description: Add a new file to the gist
          - names:
              - -d
              - --desc
            argument: string
            description: New description for the gist
          - names:
              - -f
              - --filename
            argument: string
            description: Select a file to edit
          - names:
              - -r
              - --remove
            argument: string
            description: Remove a file from the gist
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: list
        description: List your gists
        usage: gh gist list [flags]
        options:
          - names:
              - --filter
            argument: expression
            description: Filter gists using a regular expression
          - names:
              - --include-content
            argument: ""
            description: Include gists' file content when filtering
          - names:
              - -L
              - --limit
            argument: int
            description: Maximum number of gists to fetch (default 10)
          - names:
              - --public
            argument: ""
            description: Show only public gists
          - names:
              - --secret
            argument: ""
            description: Show only secret gists
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: rename
        description: Rename a file in a gist
        usage: gh gist rename {<id> | <url>} <oldFilename> <newFilename> [flags]
        options:
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: view
        description: View a gist
        usage: gh gist view [<id> | <url>] [flags]
        options:
          - names:
              - -f
              - --filename
            argument: string
            description: Display a single file from the gist
          - names:
              - --files
            argument: ""
            description: List file names from the gist
          - names:
              - -r
              - --raw
            argument: ""
            description: Print raw instead of rendered gist contents
          - names:
              - -w
              - --web
            argument: ""
            description: Open gist in the browser
          - names:
              - --help
            argument: ""
            description: Show help for command
  - name: issue
    description: Manage issues
    usage: gh issue <command> [flags]
    options:
      - names:
          - -R
          - --repo
        argument: '[HOST/]OWNER/REPO'
        description: Select another repository using the [HOST/]OWNER/REPO format
      - names:
          - --help
        argument: ""
        description: Show help for command
    subcommands:
      - name: create
        description: Create a new issue
        usage: gh issue create [flags]
        options:
          - names:
              - -a
              - --assignee
            argument: login
            description: Assign people by their login. Use "@me" to self-assign.
          - names:
              - -b
              - --body
            argument: string
            description: Supply a body. Will prompt for one otherwise.
          - names:
              - -F
              - --body-file
            argument: file
            description: Read body text from file (use "-" to read from standard input)
          - names:
              - -e
              - --editor
            argument: ""
            description: Skip prompts and open the text editor to write the title and body in. The first line is the title and the remaining text is the body.
          - names:
              - -l
              - --label
            argument: name
            description: Add labels by name
          - names:
              - -m
              - --milestone
            argument: name
            description: Add the issue to a milestone by name
          - names:
              - -p
              - --project
            argument: title
            description: Add the issue to projects by title
          - names:
              - --recover
            argument: string
            description: Recover input from a failed run of create
          - names:
              - -T
              - --template
            argument: file
            description: Template file to use as starting body text
          - names:
              - -t
              - --title
            argument: string
            description: Supply a title. Will prompt for one otherwise.
          - names:
              - -w
              - --web
            argument: ""
            description: Open the browser to create an issue
          - names:
              - --help
            argument: ""
            description: Show help for command
          - names:
              - -R
              - --repo
            argument: '[HOST/]OWNER/REPO'
            description: Select another repository using the [HOST/]OWNER/REPO format
      - name: list
        description: List issues in a repository
        usage: gh issue list [flags]
        options:
          - names:
              - --app
            argument: string
            description: Filter by GitHub App author
          - names:
              - -a
              - --assignee
            argument: string
            description: Filter by assignee
          - names:
              - -A
              - --author
            argument: string
            description: Filter by author
          - names:
              - -q
              - --jq
            argument: expression
            description: Filter JSON output using a jq expression
          - names:
              - --json
            argument: fields
            description: Output JSON with the specified fields
          - names:
              - -l
              - --label
            argument: strings
            description: Filter by label
          - names:
