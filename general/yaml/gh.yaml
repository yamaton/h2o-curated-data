    usage: gh attestation [subcommand] [flags]
    options:
      - names:
          - --help
        argument: ""
        description: Show help for command
    subcommands:
      - name: download
        description: Download an artifact's attestations for offline use
        usage: gh attestation download [<file-path> | oci://<image-uri>] [--owner | --repo] [flags]
        options:
          - names:
              - -d
