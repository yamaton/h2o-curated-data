            argument: string
            description: 'The algorithm used to compute a digest of the artifact: {sha256|sha512} (default "sha256")'
          - names:
              - --hostname
            argument: string
            description: Configure host to use
          - names:
              - -L
              - --limit
            argument: int
            description: Maximum number of attestations to fetch (default 30)
          - names:
              - -o
              - --owner
            argument: string
            description: a GitHub organization to scope attestation lookup by
          - names:
              - --predicate-type
            argument: string
            description: Filter attestations by provided predicate type
          - names:
              - -R
              - --repo
            argument: string
            description: Repository name in the format <owner>/<repo>
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: trusted-root
        description: Output trusted_root.jsonl contents, likely for offline verification
        usage: gh attestation trusted-root [--tuf-url <url> --tuf-root <file-path>] [--verify-only] [flags]
        options:
          - names:
              - --hostname
            argument: string
            description: Configure host to use
          - names:
              - --tuf-root
            argument: string
            description: Path to the TUF root.json file on disk
          - names:
              - --tuf-url
            argument: string
            description: URL to the TUF repository mirror
          - names:
              - --verify-only
            argument: ""
            description: Don't output trusted_root.jsonl contents
          - names:
              - --help
            argument: ""
            description: Show help for command
      - name: verify
        description: Verify an artifact's integrity using attestations
        usage: gh attestation verify [<file-path> | oci://<image-uri>] [--owner | --repo] [flags]
        options:
          - names:
              - -b
              - --bundle
            argument: string
            description: Path to bundle on disk, either a single bundle in a JSON file or a JSON lines file with multiple bundles
          - names:
              - --bundle-from-oci
            argument: ""
            description: When verifying an OCI image, fetch the attestation bundle from the OCI registry instead of from GitHub
          - names:
              - --cert-identity
            argument: string
            description: Enforce that the certificate's subject alternative name matches the provided value exactly
          - names:
              - -i
              - --cert-identity-regex
            argument: string
            description: Enforce that the certificate's subject alternative name matches the provided regex
          - names:
              - --cert-oidc-issuer
            argument: string
            description: Issuer of the OIDC token (default "https://token.actions.githubusercontent.com")
          - names:
              - --custom-trusted-root
            argument: string
            description: Path to a trusted_root.jsonl file; likely for offline verification
          - names:
              - --deny-self-hosted-runners
            argument: ""
            description: Fail verification for attestations generated on self-hosted runners
          - names:
              - -d
              - --digest-alg
            argument: string
            description: 'The algorithm used to compute a digest of the artifact: {sha256|sha512} (default "sha256")'
          - names:
              - --format
            argument: string
            description: 'Output format: {json}'
          - names:
              - --hostname
            argument: string
            description: Configure host to use
          - names:
              - -q
              - --jq
            argument: expression
            description: Filter JSON output using a jq expression
          - names:
              - -L
              - --limit
            argument: int
            description: Maximum number of attestations to fetch (default 30)
          - names:
              - --no-public-good
            argument: ""
            description: Do not verify attestations signed with Sigstore public good instance
          - names:
              - -o
              - --owner
            argument: string
            description: GitHub organization to scope attestation lookup by
          - names:
              - --predicate-type
            argument: string
            description: Filter attestations by provided predicate type (default "https://slsa.dev/provenance/v1")
          - names:
