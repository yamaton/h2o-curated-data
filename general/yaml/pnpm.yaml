              - --json
            argument: ""
            description: When setting, parse the value as JSON. When getting a single key, return its JSON-encoded form instead of the raw value
        positionalArguments:
          - name: <PAIRS>...
            description: key=value pairs to set in package.json
      - name: delete
        description: Deletes a key from package.json
        usage: pnpm pkg delete [OPTIONS] <KEYS>...
        options:
          - names:
              - --json
            argument: ""
            description: When setting, parse the value as JSON. When getting a single key, return its JSON-encoded form instead of the raw value
        positionalArguments:
          - name: <KEYS>...
            description: Keys to delete from package.json
      - name: fix
        description: Auto corrects common errors in package.json
        usage: pnpm pkg fix [OPTIONS]
        options:
          - names:
              - --json
            argument: ""
            description: When setting, parse the value as JSON. When getting a single key, return its JSON-encoded form instead of the raw value
      - name: help
        description: Print this message or the help of the given subcommand(s)
        usage: pnpm pkg help [COMMAND]...
        options: []
        positionalArguments:
          - name: '[COMMAND]...'
            description: Command whose help to print
  - name: pack-app
    description: Pack a `CommonJS` entry file into a standalone executable for one or more target platforms
    usage: pnpm pack-app [OPTIONS] [PARAMS]...
    options:
      - names:
          - --entry
        argument: <ENTRY>
        description: Path to the CJS entry file to embed in the executable
      - names:
          - -t
          - --target
        argument: <TARGET>
        description: 'Target to build for. May be specified multiple times. Supported: linux-x64, linux-x64-musl, linux-arm64, linux-arm64-musl, darwin-x64, darwin-arm64, win32-x64, win32-arm64'
      - names:
          - --runtime
        argument: <RUNTIME>
        description: Runtime to embed, as a `<name>@<version>` spec (e.g. `node@25`, `node@25.5.0`). Only `node` is supported, and the version must be >= v25.5. Defaults to the minimum SEA-capable version (v25.5.0)
      - names:
          - -o
          - --output-dir
        argument: <OUTPUT_DIR>
        description: Output directory for the built executables. Defaults to `dist-app`
      - names:
          - --output-name
        argument: <OUTPUT_NAME>
        description: Name for the output executable (without extension). Defaults to the unscoped package name
    positionalArguments:
      - name: '[PARAMS]...'
        description: Positional arguments. The first is used as the CJS entry file when `--entry` is omitted; the rest are ignored
  - name: store
    description: Managing the package store
    usage: pnpm store [OPTIONS] <COMMAND>
    options: []
    subcommands:
      - name: status
        description: Checks for modified packages in the store. Returns exit code 0 if the content of the package is the same as it was at the time of unpacking
        usage: pnpm store status [OPTIONS]
        options: []
      - name: add
        description: Functionally equivalent to pnpm add, except this adds new packages to the store directly without modifying any projects or files outside of the store
        usage: pnpm store add [OPTIONS] [PACKAGES]...
        options: []
        positionalArguments:
          - name: '[PACKAGES]...'
            description: The packages to fetch into the store, e.g. `express@4`
      - name: prune
        description: Removes unreferenced packages from the store. Unreferenced packages are packages that are not used by any projects on the system. Packages can become unreferenced after most installation operations, for instance when dependencies are made redundant
        usage: pnpm store prune [OPTIONS]
        options: []
      - name: path
        description: Returns the path to the active store directory
        usage: pnpm store path [OPTIONS]
        options: []
      - name: help
        description: Print this message or the help of the given subcommand(s)
        usage: pnpm store help [COMMAND]...
        options: []
        positionalArguments:
          - name: '[COMMAND]...'
            description: Command whose help to print
  - name: cache
    description: Inspect and manage the metadata cache
    usage: pnpm cache [OPTIONS] <COMMAND>
    options: []
    subcommands:
      - name: list
        description: Lists the available packages metadata cache. Supports filtering by glob
        usage: pnpm cache list [OPTIONS] [PACKAGES]...
        options: []
        positionalArguments:
          - name: '[PACKAGES]...'
            description: Package names to list from the cache
      - name: list-registries
        description: Lists all registries that have their metadata cache locally
        usage: pnpm cache list-registries [OPTIONS]
        options: []
      - name: path
        description: Prints the path to the cache directory
        usage: pnpm cache path [OPTIONS]
        options: []
      - name: view
        description: Views information from the specified package's cache
        usage: pnpm cache view [OPTIONS] <PACKAGE>
        options: []
        positionalArguments:
          - name: <PACKAGE>
            description: Package whose cached metadata to display
      - name: delete
        description: Deletes metadata cache for the specified package(s). Supports patterns
        usage: pnpm cache delete [OPTIONS] [PACKAGES]...
        options: []
        positionalArguments:
          - name: '[PACKAGES]...'
            description: Package names to delete from the cache
      - name: help
        description: Print this message or the help of the given subcommand(s)
        usage: pnpm cache help [COMMAND]...
        options: []
        positionalArguments:
          - name: '[COMMAND]...'
            description: Command whose help to print
  - name: cat-file
    description: Prints the contents of a file based on the hash value stored in the index file
    usage: pnpm cat-file [OPTIONS] <HASH>
    options: []
    positionalArguments:
      - name: <HASH>
        description: The hash of the file to read (e.g. sha512-...)
  - name: cat-index
    description: Prints the index file of a specific package from the store
    usage: pnpm cat-index [OPTIONS] <WANTED_DEPENDENCY>
    options: []
    positionalArguments:
      - name: <WANTED_DEPENDENCY>
        description: The package specifier (e.g., `pkg@version`)
  - name: ignored-builds
    description: Print the list of packages with blocked build scripts
    usage: pnpm ignored-builds [OPTIONS]
    options: []
  - name: approve-builds
    description: Approve dependencies for running scripts during installation
    usage: pnpm approve-builds [OPTIONS] [PACKAGES]...
    options:
      - names:
          - --all
        argument: ""
        description: Approve all pending dependencies without interactive prompts
      - names:
          - -g
          - --global
        argument: ""
        description: Approve builds for globally installed packages
    positionalArguments:
      - name: '[PACKAGES]...'
        description: Packages to approve (`<pkg>`) or deny (`!<pkg>`). With no packages, the packages awaiting approval are chosen interactively
  - name: link
    aliases:
      - ln
    description: Links a local package as a dependency
    usage: pnpm link [OPTIONS] [PACKAGE_PATHS]...
    options: []
    positionalArguments:
      - name: '[PACKAGE_PATHS]...'
        description: Paths to local packages to link
  - name: import
    description: Generates a pnpm-lock.yaml from an external lockfile
    usage: pnpm import [OPTIONS]
    options:
      - names:
          - --pnpr-server
        argument: <PNPR_SERVER>
        description: URL of a pnpr server to offload lockfile resolution to
  - name: dedupe
    description: Deduplicate packages in the lockfile
    usage: pnpm dedupe [OPTIONS]
    options:
      - names:
          - --check
        argument: ""
        description: Check if running dedupe would result in changes without installing packages or editing the lockfile. Exits with a non-zero status code if changes are possible
      - names:
          - --lockfile-only
        argument: ""
        description: Only update `pnpm-lock.yaml`. Don't download packages or write `node_modules`
      - names:
          - --ignore-scripts
        argument: ""
        description: Don't run lifecycle scripts of the project or its dependencies. Packages are still installed; only their build scripts are skipped, and the install won't fail because of it
      - names:
          - --no-ignore-scripts
        argument: ""
        description: Run lifecycle scripts even when the configuration disables them
      - names:
          - --offline
        argument: ""
        description: Fail on a cache miss instead of fetching from the registry, using only packages already in the store
      - names:
          - --no-offline
        argument: ""
        description: Allow network fetches even when the configuration enables offline mode
      - names:
          - --prefer-offline
        argument: ""
        description: Prefer packages already in the cache over the network, even past their freshness window
      - names:
          - --no-prefer-offline
        argument: ""
        description: Don't prefer cached packages even when the configuration enables it
      - names:
          - --ignore-pnpmfile
        argument: ""
        description: Disable pnpm hooks defined in `.pnpmfile.cjs`, including the pnpmfiles of config dependencies
  - name: deploy
    description: Deploy a package from a workspace
    usage: pnpm deploy [OPTIONS] [DIR]...
    options:
      - names:
          - -P
          - --prod
          - --production
        argument: ""
        description: Install only production dependencies. devDependencies are skipped, and removed if already installed. Takes precedence over `NODE_ENV`
      - names:
          - -D
          - --dev
        argument: ""
        description: Install only devDependencies. Regular dependencies are skipped, and removed if already installed, regardless of `NODE_ENV`
      - names:
          - --optional
        argument: ""
        description: Include optionalDependencies even when the configured default excludes them
      - names:
          - --no-optional
        argument: ""
        description: Don't install optionalDependencies
      - names:
          - --cpu
        argument: <CPU>...
        description: CPU architectures whose platform-specific optional dependencies should be installed. Repeat or comma-separate for multiple values
      - names:
          - --os
        argument: <OS>...
        description: Operating systems whose platform-specific optional dependencies should be installed. Repeat or comma-separate for multiple values
      - names:
          - --libc
        argument: <LIBC>...
        description: libc families whose platform-specific optional dependencies should be installed (`glibc`, `musl`). Repeat or comma-separate for multiple values
      - names:
          - --frozen-lockfile
        argument: ""
        description: Don't generate a lockfile, and fail if an update to it is needed. This setting is enabled by default in CI when a lockfile is present
      - names:
          - --no-frozen-lockfile
        argument: ""
        description: 'Allow the lockfile to be updated, overriding a `frozenLockfile: true` setting'
      - names:
          - --lockfile-only
        argument: ""
        description: Only update `pnpm-lock.yaml`. Don't download packages or write `node_modules`
      - names:
          - --lockfile-dir
        argument: <dir>
        description: The directory in which `pnpm-lock.yaml` is created. Several projects may share a single lockfile
      - names:
          - --merge-git-branch-lockfiles
        argument: ""
        description: Fold every per-branch lockfile (`pnpm-lock.<branch>.yaml`, written under the `gitBranchLockfile` setting) into `pnpm-lock.yaml` and delete them
      - names:
          - --merge-git-branch-lockfiles-branch-pattern
        argument: <MERGE_GIT_BRANCH_LOCKFILES_BRANCH_PATTERN>
        description: Glob patterns naming the branches that merge the per-branch lockfiles, so a mainline branch does not have to pass `--merge-git-branch-lockfiles` by hand
      - names:
          - --dry-run
        argument: ""
        description: Show what an install would change without writing anything to disk
      - names:
          - --force
        argument: ""
        description: 'Reinstall every package the lockfile names: relink packages an earlier install already materialized, and install optional dependencies whose `cpu` / `os` / `libc` / `engines` don''t match the host instead of skipping them'
      - names:
          - --prefer-frozen-lockfile
        argument: ""
        description: Prefer the existing lockfile over re-resolving, even when the manifest may have changed
      - names:
          - --no-prefer-frozen-lockfile
        argument: ""
        description: Always re-resolve against the registry instead of preferring the existing lockfile
      - names:
          - --ignore-manifest-check
        argument: ""
        description: Skip the check that `pnpm-lock.yaml` is up to date with `package.json` under `--frozen-lockfile`. For callers that just wrote the lockfile themselves and know the manifest is about to catch up
      - names:
          - --no-runtime
        argument: ""
        description: Don't install runtime dependencies (`node`, `deno`, `bun`). Their archives aren't fetched and their bins aren't linked; the rest of the install proceeds normally
      - names:
          - --ignore-scripts
        argument: ""
        description: Don't run lifecycle scripts of the project or its dependencies. Packages are still installed; only their build scripts are skipped, and the install won't fail because of it
      - names:
          - --no-ignore-scripts
        argument: ""
        description: Run lifecycle scripts even when the configuration disables them
      - names:
          - --ignore-pnpmfile
        argument: ""
        description: Disable pnpm hooks defined in `.pnpmfile.cjs`, including the pnpmfiles of config dependencies
      - names:
          - --node-linker
        argument: <NODE_LINKER>
        description: 'Which node linker to use: `isolated` (the default, a symlinked store), `hoisted` (a flat `node_modules`), or `pnp` (Plug''n''Play). Overrides the configured value'
      - names:
          - --offline
        argument: ""
        description: Fail on a cache miss instead of fetching from the registry, using only packages already in the store
      - names:
          - --no-offline
        argument: ""
        description: Allow network fetches even when the configuration enables offline mode
      - names:
          - --frozen-store
        argument: ""
        description: Open the store read-only and skip all store writes. For installing against a store on a read-only filesystem (e.g. a Nix store); pair with `--offline --frozen-lockfile`
      - names:
          - --no-frozen-store
        argument: ""
        description: Allow store writes even when the configuration enables the read-only store
      - names:
          - --prefer-offline
        argument: ""
        description: Prefer packages already in the cache over the network, even past their freshness window
      - names:
          - --no-prefer-offline
        argument: ""
        description: Don't prefer cached packages even when the configuration enables it
      - names:
          - --trust-lockfile
        argument: ""
        description: Skip verifying the lockfile against supply-chain policies
      - names:
          - --no-trust-lockfile
        argument: ""
        description: Verify the lockfile against supply-chain policies even when the configuration trusts it
      - names:
          - --update-checksums
        argument: ""
        description: Refresh the integrity checksums in `pnpm-lock.yaml` from the registry. Cannot be combined with `--frozen-lockfile`
      - names:
          - --network-concurrency
        argument: <NETWORK_CONCURRENCY>
        description: Maximum number of concurrent network requests during install
      - names:
          - --fetch-timeout
        argument: <FETCH_TIMEOUT>
        description: Per-request network timeout, in milliseconds
      - names:
          - --fetch-warn-timeout-ms
        argument: <FETCH_WARN_TIMEOUT_MS>
        description: Warn when a registry metadata request takes longer than this many milliseconds
      - names:
          - --fetch-min-speed-ki-bps
        argument: <FETCH_MIN_SPEED_KI_BPS>
        description: Warn when a tarball download's average speed is below this many KiB/s
      - names:
          - --user-agent
        argument: <USER_AGENT>
        description: '`User-Agent` header to send on registry requests'
      - names:
          - --pnpr-server
        argument: <PNPR_SERVER>
        description: URL of a pnpr server to offload resolution and file fetching to. `node_modules` is still linked locally from the server-produced lockfile
      - names:
          - --legacy
        argument: ""
        description: Use the legacy deploy implementation
    positionalArguments:
      - name: '[DIR]...'
        description: Target deploy directory
  - name: prune
    description: Remove extraneous packages
    usage: pnpm prune [OPTIONS]
    options:
      - names:
          - -P
          - --prod
          - --production
        argument: ""
        description: '[alias: --production]'
      - names:
          - --no-ignore-scripts
        argument: ""
        description: Run lifecycle scripts even if scripts are disabled by configuration
  - name: fetch
    description: Fetch packages from the lockfile into the virtual store
    usage: pnpm fetch [OPTIONS]
    options:
      - names:
          - -P
          - --prod
          - --production
        argument: ""
        description: '[alias: --production]'
      - names:
          - --ignore-pnpmfile
        argument: ""
        description: Disable pnpm hooks defined in `.pnpmfile.cjs`, including the pnpmfiles of config dependencies
  - name: unlink
    aliases:
      - dislink
    description: Removes links to a local package and reinstalls it
    usage: pnpm unlink [OPTIONS] [PACKAGE_NAMES]...
    options:
      - names:
          - --ignore-pnpmfile
        argument: ""
        description: Disable pnpm hooks defined in `.pnpmfile.cjs`, including the pnpmfiles of config dependencies
    positionalArguments:
      - name: '[PACKAGE_NAMES]...'
        description: Package names to unlink
  - name: docs
    aliases:
      - home
    description: Opens the documentation of a package in the browser
    usage: pnpm docs [OPTIONS] <PACKAGE>
    options: []
    positionalArguments:
      - name: <PACKAGE>
        description: Package name (optionally with @version)
  - name: repo
    description: Opens the URL of the package's repository in a browser
    usage: pnpm repo [OPTIONS] [PACKAGES]...
    options: []
    positionalArguments:
      - name: '[PACKAGES]...'
        description: Package names (optionally with @version) to look up
  - name: self-update
    description: Updates pnpm to the latest version (or the one specified)
    usage: pnpm self-update [OPTIONS] [VERSION]
    options: []
    positionalArguments:
      - name: '[VERSION]'
        description: The version, range, or dist-tag to update to. Defaults to the `latest` dist-tag (which refuses to downgrade)
  - name: setup
    description: Sets up pnpm
    usage: pnpm setup [OPTIONS]
    options:
      - names:
          - -f
          - --force
        argument: ""
        description: Override the PNPM_HOME env variable in case it already exists
  - name: login
    aliases:
      - adduser
    description: Log in to an npm registry
    usage: pnpm login [OPTIONS]
    options:
      - names:
          - --scope
        argument: <SCOPE>
        description: Associate the login token with a package scope and record the scope-to-registry mapping
  - name: team
    description: Manage organization teams and team memberships
    usage: pnpm team [OPTIONS] [PARAMS]...
    options:
      - names:
          - --otp
        argument: <OTP>
        description: One-time password for registries that require two-factor authentication
      - names:
          - --parseable
        argument: ""
        description: Output parseable results (tab-separated)
      - names:
          - --json
        argument: ""
        description: Output results as JSON
    positionalArguments:
      - name: '[PARAMS]...'
        description: Subcommand and arguments
  - name: owner
    aliases:
      - owners
    description: Manage package owners on the registry
    usage: pnpm owner [OPTIONS] [PARAMS]...
    options:
      - names:
          - --otp
        argument: <OTP>
        description: One-time password for registries that require two-factor authentication
    positionalArguments:
      - name: '[PARAMS]...'
        description: Subcommand and arguments
  - name: logout
    description: Log out of an npm registry
    usage: pnpm logout [OPTIONS]
    options: []
  - name: with
    description: Runs pnpm at a specific version (or the currently running one) for a single invocation, ignoring the "packageManager" and "devEngines.packageManager" fields of the project's manifest
    usage: pnpm with [OPTIONS] [PARAMS]...
    options: []
    positionalArguments:
      - name: '[PARAMS]...'
        description: The pnpm version, range, or dist-tag to run — or `current` to use the pnpm that is already running — followed by the pnpm command and its arguments
  - name: edit
    description: Not implemented in pnpm. Use the npm CLI directly
    usage: pnpm edit [OPTIONS] [PARAMS]...
    options: []
    positionalArguments:
      - name: '[PARAMS]...'
        description: Arguments accepted for npm compatibility
  - name: profile
    description: Not implemented in pnpm. Use the npm CLI directly
    usage: pnpm profile [OPTIONS] [PARAMS]...
    options: []
    positionalArguments:
      - name: '[PARAMS]...'
        description: Arguments accepted for npm compatibility
  - name: token
    description: Not implemented in pnpm. Use the npm CLI directly
    usage: pnpm token [OPTIONS] [PARAMS]...
    options: []
    positionalArguments:
      - name: '[PARAMS]...'
        description: Arguments accepted for npm compatibility
  - name: xmas
    description: Not implemented in pnpm. Use the npm CLI directly
    usage: pnpm xmas [OPTIONS] [PARAMS]...
    options: []
    positionalArguments:
      - name: '[PARAMS]...'
        description: Arguments accepted for npm compatibility
  - name: help
    description: Print this message or the help of the given subcommand(s)
    usage: pnpm help [COMMAND]...
    options: []
    positionalArguments:
      - name: '[COMMAND]...'
        description: Command whose help to print
version: 12.0.0
tldr: |
  > Fast, disk space efficient package manager for Node.js.
  > Manage Node.js projects and their module dependencies.
  > More information: <https://pnpm.io/pnpm-cli>.

  - Create a `package.json` file:

  `pnpm init`

  - Download all the packages listed as dependencies in `package.json`:

  `pnpm {{[i|install]}}`

  - Download a specific version of a package and add it to the list of dependencies in `package.json`:

  `pnpm add {{module_name}}@{{version}}`

  - Download a package and add it to the list of dev dependencies in `package.json`:

  `pnpm add {{module_name}} {{[-D|--save-dev]}}`

  - Download a package and install it globally:

  `pnpm add {{module_name}} {{[-g|--global]}}`

  - Uninstall a package and remove it from the list of dependencies in `package.json`:

  `pnpm {{[rm|remove]}} {{module_name}}`

  - Print a tree of locally installed modules:

  `pnpm {{[ls|list]}}`

  - List top-level globally installed modules:

  `pnpm {{[ls|list]}} {{[-g|--global]}} --depth {{0}}`
