        argument: <NODE_LINKER>
        description: 'Which node linker to use: `isolated` (the default, a symlinked store), `hoisted` (a flat `node_modules`), or `pnp` (Plug''n''Play). Overrides the configured value'
      - names:
          - --offline
        argument: ""
        description: Fail on a cache miss instead of fetching from the registry, using only packages already in the store
      - names:
          - --no-offline
        argument: ""
        description: Allow network fetches even when the configuration enables offline mode
      - names:
          - --frozen-store
        argument: ""
        description: Open the store read-only and skip all store writes. For installing against a store on a read-only filesystem (e.g. a Nix store); pair with `--offline --frozen-lockfile`
      - names:
          - --no-frozen-store
        argument: ""
        description: Allow store writes even when the configuration enables the read-only store
      - names:
          - --prefer-offline
        argument: ""
        description: Prefer packages already in the cache over the network, even past their freshness window
      - names:
          - --no-prefer-offline
        argument: ""
        description: Don't prefer cached packages even when the configuration enables it
      - names:
          - --trust-lockfile
        argument: ""
        description: Skip verifying the lockfile against supply-chain policies
      - names:
          - --no-trust-lockfile
        argument: ""
        description: Verify the lockfile against supply-chain policies even when the configuration trusts it
      - names:
          - --update-checksums
        argument: ""
        description: Refresh the integrity checksums in `pnpm-lock.yaml` from the registry. Cannot be combined with `--frozen-lockfile`
      - names:
          - --network-concurrency
        argument: <NETWORK_CONCURRENCY>
        description: Maximum number of concurrent network requests during install
      - names:
          - --fetch-timeout
        argument: <FETCH_TIMEOUT>
        description: Per-request network timeout, in milliseconds
      - names:
          - --fetch-warn-timeout-ms
        argument: <FETCH_WARN_TIMEOUT_MS>
        description: Warn when a registry metadata request takes longer than this many milliseconds
      - names:
          - --fetch-min-speed-ki-bps
        argument: <FETCH_MIN_SPEED_KI_BPS>
        description: Warn when a tarball download's average speed is below this many KiB/s
      - names:
          - --user-agent
        argument: <USER_AGENT>
        description: '`User-Agent` header to send on registry requests'
      - names:
          - --pnpr-server
        argument: <PNPR_SERVER>
        description: URL of a pnpr server to offload resolution and file fetching to. `node_modules` is still linked locally from the server-produced lockfile
    positionalArguments:
      - name: '[ARGS]...'
        description: Arguments passed to the script after the script name
  - name: update
    aliases:
      - up
      - upgrade
    description: Update packages to their newest version based on the specified range
    usage: pnpm update [OPTIONS] [PACKAGES]...
    options:
      - names:
          - -P
          - --prod
          - --production
        argument: ""
        description: Update packages only in "dependencies" and "optionalDependencies"
      - names:
          - -D
          - --dev
        argument: ""
        description: Update packages only in "devDependencies"
      - names:
          - --optional
        argument: ""
        description: Update packages only in "optionalDependencies"
      - names:
          - --no-optional
        argument: ""
        description: Don't update packages in "optionalDependencies"
      - names:
          - --cpu
        argument: <CPU>...
        description: CPU architectures whose platform-specific optional dependencies should be installed. Repeat or comma-separate for multiple values
      - names:
          - --os
        argument: <OS>...
        description: Operating systems whose platform-specific optional dependencies should be installed. Repeat or comma-separate for multiple values
      - names:
          - --libc
        argument: <LIBC>...
        description: libc families whose platform-specific optional dependencies should be installed (`glibc`, `musl`). Repeat or comma-separate for multiple values
      - names:
          - -L
          - --latest
        argument: ""
        description: 'Ignore version ranges in package.json: bump the matched packages to their latest version and rewrite the manifest ranges'
      - names:
          - --patches
        argument: ""
        description: Refresh registry revisions without changing package versions
      - names:
          - -E
          - --save-exact
        argument: ""
        description: Write the resolved version without a range operator when rewriting the manifest under `--latest`
      - names:
          - --no-save
        argument: ""
        description: Do not write the updated ranges back to package.json. The lockfile is still updated (the `--no-save` flag)
      - names:
          - --depth
        argument: <DEPTH>
        description: How deep to inspect dependencies. `0` means top-level dependencies only. Defaults to unlimited
      - names:
          - --lockfile-only
        argument: ""
        description: Dependencies are not downloaded; only `pnpm-lock.yaml` is updated
      - names:
          - --lockfile-dir
        argument: <dir>
        description: The directory in which `pnpm-lock.yaml` is created. Several projects may share a single lockfile
      - names:
          - -i
          - --interactive
        argument: ""
        description: Show outdated dependencies and select which ones to update
      - names:
          - --include-github-actions
        argument: ""
        description: Also update GitHub Actions dependencies in workflow and action files
      - names:
          - -g
          - --global
        argument: ""
        description: Update globally installed packages
      - names:
          - --workspace
        argument: ""
        description: Tries to link all packages from the workspace, updating versions to match the workspace packages
      - names:
          - --changeset
        argument: ""
        description: Generate a changeset file declaring a patch bump for every workspace package whose production dependencies were changed by the update
      - names:
          - --no-changeset
        argument: ""
        description: Do not generate a changeset, even when `updateConfig.changeset` enables changeset generation by default
      - names:
          - --ignore-pnpmfile
        argument: ""
        description: Disable pnpm hooks defined in `.pnpmfile.cjs`, including the pnpmfiles of config dependencies
      - names:
          - --pnpr-server
        argument: <PNPR_SERVER>
        description: URL of a pnpr server to offload revision refresh resolution to
    positionalArguments:
      - name: '[PACKAGES]...'
        description: Dependencies to update. Package names (`foo`, `@scope/bar`), GitHub Actions (`actions/checkout`, with `--include-github-actions`), glob patterns (`@scope/bar-*`), and versioned selectors (`foo@2`) are accepted. With no arguments, every direct dependency in the included groups is updated
  - name: outdated
    description: Check for outdated package and GitHub Actions dependencies
    usage: pnpm outdated [OPTIONS] [PACKAGES]...
    options:
      - names:
          - -P
          - --prod
          - --production
        argument: ""
        description: Check only "dependencies" and "optionalDependencies"
      - names:
          - -D
          - --dev
        argument: ""
        description: Check only "devDependencies"
      - names:
          - --no-optional
        argument: ""
        description: Don't check "optionalDependencies"
      - names:
          - --optional
        argument: ""
        description: Include "optionalDependencies"
      - names:
          - --compatible
        argument: ""
        description: Print only versions that satisfy the ranges in package.json
      - names:
          - --long
        argument: ""
        description: Print details about the outdated packages (homepage, deprecation notice)
      - names:
          - --format
        argument: <FORMAT>
        description: Output format
      - names:
          - --no-table
        argument: ""
        description: Shorthand for `--format list`. Good for small consoles
      - names:
          - --json
        argument: ""
        description: Shorthand for `--format json`
      - names:
          - --sort-by
        argument: <SORT_BY>
        description: Sorting method. Currently only `name` is supported; the default sorts by the size of the version change, then by name
      - names:
          - --include-github-actions
        argument: ""
        description: Also check GitHub Actions dependencies in workflow and action files
      - names:
          - -g
          - --global
        argument: ""
        description: Check globally installed packages
    positionalArguments:
      - name: '[PACKAGES]...'
        description: Restrict the check to dependencies whose name matches one of these patterns (`*` wildcard, leading `!` to negate). With no arguments, every direct dependency in the included groups is checked
  - name: audit
    description: Checks for known security issues with the installed packages
    usage: pnpm audit [OPTIONS] [PARAMS]...
    options:
      - names:
          - --json
        argument: ""
        description: Output audit report in JSON format
      - names:
          - --audit-level
        argument: <AUDIT_LEVEL>
        description: Only print advisories with severity greater than or equal to this level
      - names:
          - -P
          - --prod
          - --production
        argument: ""
        description: Only audit "dependencies" and "optionalDependencies"
      - names:
          - -D
          - --dev
        argument: ""
        description: Only audit "devDependencies"
      - names:
          - --no-optional
        argument: ""
        description: Don't audit "optionalDependencies"
      - names:
          - --optional
        argument: ""
        description: Include "optionalDependencies"
      - names:
          - --ignore-registry-errors
        argument: ""
        description: Use exit code 0 if the registry responds with an error
      - names:
          - --fix
        argument: '[<METHOD>]'
        description: 'Fix the audited vulnerabilities using the specified method: "override" or "update". "override" adds overrides to `pnpm-workspace.yaml` to force non-vulnerable versions; "update" re-resolves the lockfile to non-vulnerable versions. Defaults to "override" when no method is given'
      - names:
          - --ignore
        argument: <GHSA>
        description: Ignore a vulnerability by its GitHub advisory ID (e.g. GHSA-xxxx-xxxx-xxxx). May be repeated
      - names:
          - --ignore-unfixable
        argument: ""
        description: Ignore all vulnerabilities for which no fix exists
      - names:
          - -i
          - --interactive
        argument: ""
        description: Show vulnerabilities and select which ones to fix interactively
    positionalArguments:
      - name: '[PARAMS]...'
        description: Audit subcommand. The only supported subcommand is `signatures`, which verifies registry signatures for the installed packages
  - name: change
    description: 'Record a change intent: which packages a change affects, the bump type for each, and a summary that becomes the changelog entry'
    usage: pnpm change [OPTIONS] [PARAMS]...
    options:
      - names:
          - --bump
        argument: <BUMP>
        description: 'Bump type for the named packages: none, patch, minor, major. "none" records an explicit decline — the change needs no release'
      - names:
          - --summary
        argument: <SUMMARY>
        description: The summary for the changelog entry. Runs non-interactively when given together with package names
    positionalArguments:
      - name: '[PARAMS]...'
        description: '`status` to print the pending intents and the release plan they produce; otherwise the packages the change affects'
  - name: version
    description: Apply the pending change intents (`pnpm version -r`)
    usage: pnpm version [OPTIONS] [PARAMS]...
    options:
      - names:
          - --dry-run
        argument: ""
        description: Print what the command would do without changing anything
      - names:
          - --no-git-checks
        argument: ""
        description: Don't check if the working tree is clean
      - names:
          - --preid
        argument: <PREID>
        description: Sets the prerelease identifier (e.g. alpha, beta, rc)
      - names:
          - --allow-same-version
        argument: ""
        description: Allow bumping to the same version
      - names:
          - --message
        argument: <MESSAGE>
        description: Commit message. "%s" is replaced with the new version. Default is "%s"
      - names:
          - --no-git-tag-version
        argument: ""
        description: Don't create a commit or tag for the version bump. Git commits and tags are always skipped in recursive mode
      - names:
          - --no-commit-hooks
        argument: ""
        description: Skip running git commit hooks when committing the version bump
      - names:
          - --sign-git-tag
        argument: ""
        description: Sign the generated git tag with GPG
      - names:
          - --tag-version-prefix
        argument: <TAG_VERSION_PREFIX>
        description: Sets the tag prefix. Default is "v". Set to empty string to remove the prefix
      - names:
          - --json
        argument: ""
        description: Show information in JSON format
    positionalArguments:
      - name: '[PARAMS]...'
        description: 'A valid semver version (e.g. 1.2.3) or one of: major, minor, patch, premajor, preminor, prepatch, prerelease, from-git. Omit it and pass `-r` to apply the pending change intents instead'
  - name: lane
    description: Manage per-package release lanes
    usage: pnpm lane [OPTIONS] [NAME]
    options: []
