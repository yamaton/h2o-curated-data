name: pnpm
description: Experimental package manager for node.js
usage: pnpm [OPTIONS] <COMMAND>
options:
  - names:
      - -v
      - --version
    argument: ""
    description: Print the pnpm version
  - names:
      - --color
    argument: '[=<COLOR>]'
    description: Force colored output
  - names:
      - -y
      - --yes
    argument: ""
    description: Automatically answer yes to prompts
  - names:
      - -C
      - --dir
    argument: <DIR>
    description: Set working directory. Accepted anywhere on the command line, before or after the subcommand, like every other rc-option
  - names:
      - --store-dir
    argument: <DIR>
    description: Directory in which the package store is created. Relative paths are resolved from the workspace root, or from `--dir` outside a workspace
  - names:
      - --state-dir
    argument: <DIR>
    description: Directory in which pnpm persists machine-local state
  - names:
      - --npmrc-auth-file
      - --userconfig
    argument: <NPMRC_AUTH_FILE>
    description: Path to an `.npmrc` to read auth settings from, overriding the default `~/.npmrc`
  - names:
      - --registry
    argument: <REGISTRY>
    description: 'Base URL of the npm registry to resolve and fetch packages from. Universal rc-option: accepted on every command and layered onto the config like `--config.registry=<url>`. Commands that expose their own `--registry` still read the same value'
  - names:
      - --https-proxy
    argument: <HTTPS_PROXY>
    description: Proxy for HTTPS registry and tarball requests
  - names:
      - --http-proxy
    argument: <HTTP_PROXY>
    description: Proxy for HTTP registry and tarball requests
  - names:
      - --no-proxy
    argument: <NO_PROXY>
    description: Hosts that bypass configured proxies
  - names:
      - -r
      - --recursive
    argument: ""
    description: Run the command for every project in the workspace instead of only the project in `--dir`
  - names:
      - --reporter
    argument: <REPORTER>
    description: Reporter output format
  - names:
      - --loglevel
    argument: <LOGLEVEL>
    description: 'What level of logs to print. Mirrors pnpm''s universal `--loglevel` option: `silent` selects the silent reporter over any `--reporter` choice; the other levels cap the default reporter''s output'
  - names:
      - -F
      - --filter
    argument: <FILTER>
    description: Select which workspace projects to run on. Repeat to add more. Each selector can be a name pattern (`@scope/*`), a path (`./pkg`), a dependency query (`foo...`), an exclusion (`!bar`), a directory (`{dir}`), or a changed-since query (`[since]`)
  - names:
      - --filter-prod
    argument: <FILTER_PROD>
    description: Like `--filter`, but follow only production dependencies when selecting projects
  - names:
      - -w
      - --workspace-root
    argument: ""
    description: Run the command on the root workspace project
  - names:
      - --fail-if-no-match
    argument: ""
    description: Exit with code 1 when the `--filter` / `--filter-prod` selectors match no workspace project
  - names:
      - --include-workspace-root
    argument: ""
    description: Also run a recursive command on the root workspace project, which `run` / `exec` / `add` / `test` otherwise leave out
  - names:
      - --no-include-workspace-root
    argument: ""
    description: 'Leave the root workspace project out of a recursive command, overriding an `includeWorkspaceRoot: true` setting'
  - names:
      - --test-pattern
    argument: <TEST_PATTERN>
    description: Glob patterns naming test files, used by the `[since]` `--filter` selector to decide which changes count
  - names:
      - --changed-files-ignore-pattern
    argument: <CHANGED_FILES_IGNORE_PATTERN>
    description: Glob patterns of changed files that the `[since]` `--filter` selector should ignore
  - names:
      - --sort
    argument: ""
    description: Keep recursive workspace projects sorted topologically
  - names:
      - --no-sort
    argument: ""
    description: Run recursive workspace projects in workspace order
  - names:
      - --reverse
    argument: ""
    description: Process recursive workspace projects in reverse order
  - names:
      - --workspace-concurrency
    argument: <WORKSPACE_CONCURRENCY>
    description: Maximum number of workspace projects to process in parallel
  - names:
      - --parallel
    argument: ""
    description: Run scripts in every selected workspace project concurrently, disregarding topological sorting
  - names:
      - --stream
    argument: ""
    description: Stream a recursive command's script output as it arrives, one prefixed line at a time
  - names:
      - --aggregate-output
    argument: ""
    description: Hold each script's streamed output until the script exits, then print it as one block
  - names:
      - --use-stderr
    argument: ""
    description: Divert the reporter's output to stderr, leaving stdout for the command's own result
  - names:
      - --ignore-workspace
    argument: ""
    description: Run as if the project were standalone, ignoring any `pnpm-workspace.yaml` above it
  - names:
      - --workspace-packages
    argument: <WORKSPACE_PACKAGES>
    description: Glob patterns selecting the workspace's projects, overriding the `packages` field of `pnpm-workspace.yaml`. Repeat to add more
  - names:
      - -h
      - --help
    argument: ""
    description: Print help (see a summary with '-h')
